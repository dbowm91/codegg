schema_version = 1

[adapter]
id = "anthropic-frontier"
version = 1
priority = 10
description = "Anthropic Claude models"

[[match]]
provider = ["anthropic"]
model_regex = "(?i)(claude|sonnet|opus|haiku)"

[profile]
prompt_profile = "frontier_reasoning"
family = "anthropic"
context_window = 128000
max_output_tokens = 16384
tool_call_reliability = "high"
instruction_adherence = "high"
patch_reliability = "high"
supports_late_system_messages = true
max_parallel_tools = 10

[tools]
format = "anthropic_tool"
tool_choice = "auto"
