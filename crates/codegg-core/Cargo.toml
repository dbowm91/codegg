[package]
name = "codegg-core"
version = "0.1.0"
edition = "2021"
description = "Core runtime, session, storage, state, and domain types for codegg"
license = "MIT"
repository = "https://github.com/dbowm91/codegg"
homepage = "https://github.com/dbowm91/codegg"
rust-version = "1.81"
build = "build.rs"

[dependencies]
codegg-config = { version = "=0.1.0", path = "../codegg-config" }
codegg-git = { version = "=0.1.0", path = "../codegg-git" }
codegg-protocol = { version = "=0.1.0", path = "../codegg-protocol" }
codegg-providers = { version = "=0.1.0", path = "../codegg-providers" }
egggit = { version = "=0.1.0", path = "../egggit" }
egglsp = { version = "=0.1.0", path = "../egglsp" }
eggsentry = { version = "=0.1.0", path = "../eggsentry" }

anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
dirs = "6"
once_cell = "1"
parking_lot = "0.12"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
# Legacy project-memory namespace reads/migration only; new writes use SHA-256.
md5 = "0.8"
similar = "3.0.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Restricted-Python parser for Tool Programs (M004). The parser's generic AST
# ranges and integer constants do not require its optional location/fold
# surface, so retain only the features used by CodeGG's parse-only frontend.
rustpython-parser = { version = "0.4.0", default-features = false, features = ["all-nodes-with-ranges", "malachite-bigint"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.4", default-features = true, features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
