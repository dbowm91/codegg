[package]
name = "codegg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core runtime, session, storage, state, and domain types for codegg"
build = "build.rs"

[lints]
workspace = true

[dependencies]
codegg-config.workspace = true
codegg-git.workspace = true
codegg-protocol.workspace = true
codegg-providers.workspace = true
eggpool-model-routing = { git = "https://github.com/eggstack/eggpool", rev = "d70b5963" }
egggit.workspace = true
egglsp.workspace = true
eggsentry.workspace = true

anyhow.workspace = true
base64.workspace = true
async-trait.workspace = true
chrono.workspace = true
dashmap.workspace = true
dirs.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
subtle.workspace = true
# Legacy project-memory namespace reads/migration only; new writes use SHA-256.
md5 = "0.8"
similar.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "derive", "chrono", "json"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde"] }

# Restricted-Python parser for Tool Programs (M004). The parser's generic AST
# ranges and integer constants do not require its optional location/fold
# surface, so retain only the features used by CodeGG's parse-only frontend.
rustpython-parser = { version = "0.4.0", default-features = false, features = ["all-nodes-with-ranges", "malachite-bigint"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1.4", default-features = true, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
regex.workspace = true
serde.workspace = true
toml.workspace = true
