[package]
name = "codegg-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LLM provider implementations for codegg"

[dependencies]
codegg-config.workspace = true
async-trait.workspace = true
bytes = "1"
futures-util.workspace = true
eggfetch-core = { workspace = true, features = ["http1", "tls-rustls", "json"] }
http.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-stream.workspace = true
tracing.workspace = true
url.workspace = true
chrono.workspace = true
dirs.workspace = true
dashmap.workspace = true
hex.workspace = true
rand.workspace = true
regex.workspace = true
uuid.workspace = true

# Crypto deps (needed by auth types)
aes-gcm.workspace = true
argon2.workspace = true
hmac.workspace = true
sha2.workspace = true

# Discovery (sqlx for DB caching)
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
