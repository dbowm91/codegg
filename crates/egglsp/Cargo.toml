[package]
name = "egglsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Language Server Protocol client extracted from Codegg."

[[bin]]
name = "egglsp-test-server"
path = "src/bin/egglsp-test-server.rs"
required-features = ["lsp-test-support"]

[features]
lsp-test-support = ["dep:base64", "dep:libc"]
lsp-real-server-tests = []

[[test]]
name = "production_protocol_stdio"
path = "tests/production_protocol_stdio.rs"
required-features = ["lsp-test-support"]

[[test]]
name = "production_semantic_stdio"
path = "tests/production_semantic_stdio.rs"
required-features = ["lsp-test-support"]

[[test]]
name = "production_service_stdio"
path = "tests/production_service_stdio.rs"
required-features = ["lsp-test-support"]

[[test]]
name = "scenario_engine"
path = "tests/scenario_engine.rs"
required-features = ["lsp-test-support"]

[[test]]
name = "real_server_smoke"
path = "tests/real_server_smoke.rs"
required-features = ["lsp-real-server-tests"]

[[test]]
name = "supervisor_restart_stdio"
path = "tests/supervisor_restart_stdio.rs"
required-features = ["lsp-test-support"]

[dependencies]
base64 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true, features = ["serde"] }
tracing.workspace = true
lsp-types = "0.97"
zip = "2"
flate2.workspace = true
tar.workspace = true
xz2 = "0.1"
walkdir.workspace = true
dirs.workspace = true
eggfetch-core = { workspace = true, features = ["http1", "tls-rustls"] }
similar.workspace = true
sha2.workspace = true
futures-util = { workspace = true, features = ["sink"] }
futures-executor.workspace = true
which = "7"
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
