[package]
name = "eggcontext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Token counting and context packing utilities extracted from Codegg."
readme = "README.md"
keywords = ["tokenizer", "llm", "context"]
