[package]
name = "eggsentry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic security scanning primitives extracted from Codegg."
readme = "README.md"
keywords = ["security", "scanning", "secrets"]
categories = ["development-tools"]
# Default features are minimal by construction: this crate defines no
# optional features, so downstream consumers get the deterministic
# scanner contract without feature unification risk.

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "fs"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
