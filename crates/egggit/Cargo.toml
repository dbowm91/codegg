[package]
name = "egggit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Read-only git and worktree facts extracted from Codegg."
readme = "README.md"
keywords = ["git", "vcs", "worktree"]
categories = ["development-tools", "filesystem"]
# Default features are minimal by construction: the only optional feature is
# `git-live-read-test-support`, which exists solely to compile the
# `LiveReadCapability` constructor used by the separately reviewed contained
# live-read route. It is off by default, so downstream consumers get the full
# read-only contract without feature unification risk and a production build
# has no way to obtain that capability.

[features]
# Test-only support for the contained live-read route. Off by default and
# absent from the shipped binary; enabling it is a reviewed decision, not a
# build convenience.
git-live-read-test-support = []

[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "io-util"] }
# Unix-only: kills the Git process group on timeout so helper processes
# (pager, credential helper, filter driver) do not outlive the child.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1.4", features = ["fs"] }
