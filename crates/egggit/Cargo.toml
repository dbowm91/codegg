[package]
name = "egggit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Read-only git and worktree facts extracted from Codegg."
readme = "README.md"
keywords = ["git", "vcs", "worktree"]
categories = ["development-tools", "filesystem"]
# Default features are minimal by construction: this crate defines no
# optional features, so downstream consumers get the full read-only
# contract without feature unification risk.

[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "io-util"] }

[dev-dependencies]
tempfile.workspace = true
