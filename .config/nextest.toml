[profile.default]
test-threads = 14
slow-timeout = { period = "30s", terminate-after = 2 }

# Optional timing profile for local diagnostic use.
# Requires cargo-nextest (install with: cargo install cargo-nextest).
# Not used by routine CI or scripts/verify.sh.
[profile.timing]
failure-output = "immediate-final"
success-output = "never"
test-threads = 1
slow-timeout = { period = "60s", terminate-after = 2 }

# Routine CI/execution profile: each test runs in its own process, up to
# 4 concurrently. Used by `.github/workflows/ci.yml` and
# `scripts/verify.sh full`. Workspace-wide only: subset runs
# (`-p <crate>`) should use the default or timing profile, because the
# heavy-binary filter below strictly requires its binaries to exist.
#
# Per-test processes are why this is sound despite process-global env
# mutation throughout the test code (auth keys, routing flags, daemon
# homes): unlike `cargo test --test-threads=N`, no two tests ever share
# an address space, so intra-suite env races are impossible by
# construction. `binary()` matches bare target names.
#
# Slot count is deliberately == runner vCPUs (4). 8 slots were tried
# 2026-09-25 and reverted: oversubscription starved real-subprocess
# timing tests (scheduler_cancellation) into flakes. Do not raise
# without re-validating a full green run.
[profile.ci]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 2 }

# Sleep/timeout-bound heavies that spawn real subprocesses and servers.
# They run alone (never overlapped with anything) so their timing stays
# deterministic and they cannot contend on process resources. Generous
# slow-timeout: these legitimately take minutes on loaded runners.
# `scheduler_cancellation` joined this list 2026-09-25: its real-`sleep`
# token assertions flaked twice under parallel load (4- and 8-slot runs)
# while passing serially.
# M002 WP3 audit (2026-09-25): whole-binary exclusivity retained for all
# five. The three interactive binaries drive real PTYs/subprocess trees
# with timing assertions throughout; the live target owns exclusive
# fixture lifecycle (mTLS node + Landlock); scheduler_cancellation has
# proven timing flakes (incl. macOS-only failures while Linux is green).
# Per-test narrowing was rejected: proving shared-slot safety per group
# would cost more hosted measurement than the execution tail can repay,
# and a wrong split reintroduces the exact flake class being removed.
[[profile.ci.overrides]]
filter = "binary(eggwork_remote_execution_live) | binary(interactive_process_attach_resume) | binary(interactive_process_sessions) | binary(interactive_terminal_tui) | binary(scheduler_cancellation)"
threads-required = "num-cpus"
slow-timeout = { period = "300s", terminate-after = 1 }
