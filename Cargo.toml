[workspace]
members = [".", "crates/codegg-core", "crates/codegg-config", "crates/codegg-protocol", "crates/codegg-providers", "crates/eggsentry", "crates/eggcontext", "crates/egggit", "crates/egglsp", "crates/codegg-git"]
resolver = "2"

[package]
name = "codegg"
version = "0.1.0"
edition = "2021"
description = "A lightweight, pure-Rust implementation of an AI coding agent"
license = "MIT"
authors = ["Anomalyco"]
repository = "https://github.com/dbowm91/codegg"
homepage = "https://github.com/dbowm91/codegg"
readme = "README.md"
keywords = ["ai", "coding", "agent", "llm", "claude"]
categories = ["command-line-utilities", "artificial-intelligence"]
rust-version = "1.81"

[[bin]]
name = "codegg-lsp-test-server"
path = "crates/egglsp-test-server/src/main.rs"
required-features = ["lsp-test-support"]

[[bin]]
name = "codegg-sandbox-helper"
path = "src/bin/codegg-sandbox-helper.rs"

[dependencies]
# Core
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "io-std",
    "net",
    "process",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"

# HTTP / Streaming
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }

# Async / Streams
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
futures-util = { version = "0.3", features = ["sink"] }
futures-executor = "0.3"
async-trait = "0.1"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }

# File operations
tokio-util = { version = "0.7", features = ["io", "rt"] }
walkdir = "2"
globset = "0.4"
ignore = "0.4"
tempfile = "3"

# Search
grep-regex = "0.1"
grep-searcher = "0.1"

# Text processing
comrak = { version = "0.35", default-features = false }
syntect = "5"
strsim = "0.11"

# Config parsing (TOML remains used for themes/plugins/skills; YAML frontmatter
# is parsed by codegg-config's format-neutral compatibility codec.)
toml = "0.8"

# UUID / IDs
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"

# Auth
url = "2"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"

# Clipboard (optional, platform-specific)
arboard = { version = "3", default-features = false, optional = true }

# Desktop notifications
notify-rust = "4"

# Directory paths
dirs = "6"

# Concurrency
parking_lot = "0.12"
dashmap = "5"

# Enum utilities
strum = { version = "0.26", features = ["derive"] }

# Regex
regex = "1"

# HTML to markdown
html2text = "0.13"

# LSP-related runtime dependencies are owned by the `egglsp` crate
# (lsp-types, zip, xz2). The root crate no longer imports them
# directly; it consumes the `egglsp` API surface and the `lsp`
# tool wrapper.
# `flate2` and `tar` are also pulled in by `egglsp` (for LSP server
# download archives), but the root crate uses them too for plugin
# installation in `src/plugin/install.rs`.
flate2 = "1"
tar = "0.4"

# Note: `notify` was previously used for config-file watching but has
# moved to the `codegg-config` crate. Do not re-add here.

# Server (feature-gated)
axum = { version = "0.8", features = ["ws"], optional = true }
http = { version = "1", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br", "compression-gzip", "set-header"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true }
subtle = "2"

# Plugins (feature-gated)
wasmtime = { version = "36", default-features = false, features = ["runtime", "cranelift", "std"], optional = true }
socket2 = { version = "0.5", optional = true }
similar = "3.0.0"
libc = "0.2"
once_cell = "1"
qrcode = { version = "0.14.1", default-features = false }
clap_complete = "4.6.2"

# Maintained Landlock bindings.  The helper is only linked on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4.7", default-features = false }

# Process group management (Unix only)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs"] }

# Image support (optional)
ratatui-image = { version = "10", default-features = false, features = ["crossterm", "image-defaults"], optional = true }
image = { version = "0.25", optional = true, features = ["png", "jpeg", "gif", "webp"] }

# Extracted tool crates
codegg-config = { version = "=0.1.0", path = "crates/codegg-config" }
codegg-protocol = { version = "=0.1.0", path = "crates/codegg-protocol" }
codegg-providers = { version = "=0.1.0", path = "crates/codegg-providers" }
eggsentry = { version = "=0.1.0", path = "crates/eggsentry" }
eggcontext = { version = "=0.1.0", path = "crates/eggcontext" }
egggit = { version = "=0.1.0", path = "crates/egggit" }
egglsp = { version = "=0.1.0", path = "crates/egglsp" }
codegg-core = { version = "=0.1.0", path = "crates/codegg-core" }
codegg-git = { version = "=0.1.0", path = "crates/codegg-git" }
eggsact = "1.1.4"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[features]
default = ["arboard"]
arboard = ["dep:arboard"]
plugins = ["wasmtime"]
debug-logging = []
server = [
    "axum",
    "http",
    "tower-http",
    "tokio-tungstenite",
    "tokio-stream",
    "socket2",
]
image = ["dep:ratatui-image", "dep:image"]
lsp-test-support = ["egglsp/lsp-test-support"]
lsp-real-server-tests = ["egglsp/lsp-real-server-tests"]

[[test]]
name = "lsp_composite_stdio"
path = "tests/lsp_composite_stdio.rs"
required-features = ["lsp-test-support"]

[[test]]
name = "projection_transport_real"
path = "tests/projection_transport_real.rs"
required-features = ["server"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.dev]
codegen-units = 16

[profile.test]
opt-level = 0
codegen-units = 16
strip = "debuginfo"
