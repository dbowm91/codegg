[workspace]
members = [".", "crates/codegg-core", "crates/codegg-config", "crates/codegg-protocol", "crates/codegg-providers", "crates/eggsentry", "crates/eggcontext", "crates/egggit", "crates/egglsp", "crates/codegg-git"]
# `crates/eggwork-test-node` is a standalone test-fixture workspace (own
# lockfile): it must resolve `eggwork-server` without this workspace's
# `sqlx` sqlite linkage (see dev-dependencies comment above).
exclude = ["crates/eggwork-test-node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/dbowm91/codegg"
homepage = "https://github.com/dbowm91/codegg"

# Workspace-owned shared dependencies (M002).
#
# Policy: this table owns versions and default-feature policy for
# dependencies repeated across multiple members. It intentionally keeps a
# minimal feature baseline; member manifests add only the features they
# actually need so small crates are not widened by a maximal union.
# Single-consumer dependencies stay local to their owning crate.
[workspace.dependencies]
# Internal crates (shared path+version release semantics).
codegg-config = { version = "=0.1.0", path = "crates/codegg-config" }
codegg-protocol = { version = "=0.1.0", path = "crates/codegg-protocol" }
codegg-providers = { version = "=0.1.0", path = "crates/codegg-providers" }
codegg-core = { version = "=0.1.0", path = "crates/codegg-core" }
codegg-git = { version = "=0.1.0", path = "crates/codegg-git" }
egggit = { version = "=0.1.0", path = "crates/egggit" }
egglsp = { version = "=0.1.0", path = "crates/egglsp" }
eggsentry = { version = "=0.1.0", path = "crates/eggsentry" }
eggcontext = { version = "=0.1.0", path = "crates/eggcontext" }
# Repeated external dependencies: version/default policy lives here,
# crate-specific features stay in member manifests.
tokio = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false }
dashmap = "6"
dirs = "6"
regex = "1"
url = { version = "2" }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures-util = { version = "0.3" }
futures-executor = "0.3"
tokio-util = { version = "0.7" }
tempfile = "3"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
hex = "0.4"
unicode-normalization = "0.1"
similar = "3.0.0"
libc = "0.2"
once_cell = "1"
subtle = "2"
flate2 = "1"
tar = "0.4"
walkdir = "2"
eggfetch-core = { version = "0.2.0", default-features = false }
http = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot = "0.12"
bytes = "1"
proptest = "1"

[workspace.lints.rust]
# Only `unsafe_code` is workspace-owned, and only for crates that already
# enforce it (`codegg` root and `codegg-core`). Crates with deliberate,
# reviewed unsafe-adjacent test helpers keep explicit local allows and do
# not inherit this table.
unsafe_code = "deny"

[package]
name = "codegg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A lightweight, pure-Rust implementation of an AI coding agent"
authors = ["Anomalyco"]
readme = "README.md"
keywords = ["ai", "coding", "agent", "llm", "claude"]
categories = ["command-line-utilities", "artificial-intelligence"]

# Note: the root package intentionally does NOT inherit `[workspace.lints]`.
# `src/lib.rs` keeps `#![deny(unsafe_code)]` for the library, while
# `src/bin/codegg-sandbox-helper.rs` contains deliberate, reviewed `unsafe`
# (fd ownership + fcntl) and must remain outside a package-wide deny.

[[bin]]
name = "codegg-lsp-test-server"
path = "crates/egglsp-test-server/src/main.rs"
required-features = ["lsp-test-support"]

[[bin]]
name = "codegg-sandbox-helper"
path = "src/bin/codegg-sandbox-helper.rs"

[dependencies]
eggup-core = { git = "https://github.com/eggstack/eggup.git", rev = "66813b3b94de3a9b2f270e0000dc339ef6f0b478" }
eggup-acquisition = { git = "https://github.com/eggstack/eggup.git", rev = "66813b3b94de3a9b2f270e0000dc339ef6f0b478" }
# Core (workspace-owned versions; member adds only its features)
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "io-std",
    "net",
    "process",
    "signal",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"

# HTTP / Streaming
eggfetch-core = { workspace = true, features = ["http1", "tls-rustls", "json"] }

# Async / Streams
tokio-stream = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["sink"] }
futures-executor.workspace = true
async-trait.workspace = true
bytes.workspace = true

# Database
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "derive", "chrono", "json"] }
chrono.workspace = true

# File operations
tokio-util = { workspace = true, features = ["io", "rt"] }
walkdir.workspace = true
globset = "0.4"
ignore = "0.4"
tempfile.workspace = true

# Search
grep-regex = "0.1"
grep-searcher = "0.1"

# Text processing
comrak = { version = "0.35", default-features = false }
syntect = "5"
strsim = "0.11"

# Config parsing (TOML remains used for themes/plugins/skills; YAML frontmatter
# is parsed by codegg-config's format-neutral compatibility codec.)
toml.workspace = true

# UUID / IDs
uuid = { workspace = true, features = ["serde"] }
semver = "1"

# Auth
url.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
aes-gcm.workspace = true
argon2.workspace = true

# Clipboard (optional, platform-specific)
arboard = { version = "3", default-features = false, optional = true }

# Desktop notifications
notify-rust = "4"

# Directory paths
dirs.workspace = true

# Concurrency
parking_lot.workspace = true
dashmap.workspace = true

# Enum utilities
strum = { version = "0.26", features = ["derive"] }

# Regex
regex.workspace = true
unicode-normalization.workspace = true

# HTML to markdown
html2text = "0.13"

# LSP-related runtime dependencies are owned by the `egglsp` crate
# (lsp-types, zip, xz2). The root crate no longer imports them
# directly; it consumes the `egglsp` API surface and the `lsp`
# tool wrapper.
# `flate2` and `tar` are also pulled in by `egglsp` (for LSP server
# download archives), but the root crate uses them too for plugin
# installation in `src/plugin/install.rs`.
flate2.workspace = true
tar.workspace = true

# Note: `notify` was previously used for config-file watching but has
# moved to the `codegg-config` crate. Do not re-add here.

# Server (feature-gated)
axum = { version = "0.8", features = ["ws"], optional = true }
http = { workspace = true, optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br", "compression-gzip", "set-header", "limit"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true }
subtle.workspace = true

# Plugins (feature-gated)
wasmtime = { version = "36.0.14", default-features = false, features = ["runtime", "cranelift", "std"], optional = true }
socket2 = { version = "0.5", optional = true }
similar.workspace = true
libc.workspace = true
once_cell.workspace = true
qrcode = { version = "0.14.1", default-features = false }
clap_complete = "4.6.2"

# Maintained Landlock bindings.  The helper is only linked on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4.7", default-features = false }

# Process group management (Unix only)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs"] }

# Image support (optional; M003 narrowed to the formats CodeGG decodes).
# `image` keeps `default-features = false` so `rayon` + `default-formats`
# (avif/dds/exr/hdr/ico/pnm/qoi/tga/tiff, ...) stay out of the optional
# graph. `png`/`jpeg`/`gif`/`webp` are the advertised TUI formats; `bmp`
# is retained as a proven runtime extra because
# `is_supported_image_format` already accepts `image/bmp` and `bmp` is a
# built-in decoder with no additional dependency family.
# `ratatui-image` keeps only the `crossterm` backend; `image-defaults`
# (`image/default`) is dropped because CodeGG's direct `image` dependency
# already owns the required decoders and ratatui-image itself only needs
# `png` (its own minimal `image` dep is `default-features = false` + `png`).
ratatui-image = { version = "10", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", default-features = false, optional = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Extracted tool crates
codegg-config.workspace = true
codegg-protocol.workspace = true
codegg-providers.workspace = true
eggsentry.workspace = true
eggcontext.workspace = true
egggit.workspace = true
egglsp.workspace = true
codegg-core.workspace = true
codegg-git.workspace = true
eggsact = "1.2.5"

# Eggwork fixed-target remote execution substrate (M001/M002a).
# Pinned to the upstream corrected, immutable C001 revision reviewed by M002a.
# Default features only: no Eggress-routed dialer (per plan §3).
eggwork-client = { git = "https://github.com/eggstack/eggwork.git", rev = "6cc813418c3f14740a635fef79208e85219175bb", default-features = false }
eggwork-core = { git = "https://github.com/eggstack/eggwork.git", rev = "6cc813418c3f14740a635fef79208e85219175bb", default-features = false }

# Optional sequence-encoder experiment. These dependencies are never part of
# the default advisor/runtime graph; the feature boundary is intentionally
# explicit until offline qualification selects a production architecture.
candle-core = { version = "0.11", default-features = false, optional = true }
candle-nn = { version = "0.11", default-features = false, optional = true }
candle-transformers = { version = "0.11", default-features = false, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# Eggwork corrective C001 live-node fixture (test-only): ephemeral identity
# generation only. The live node itself runs in the workspace-excluded
# `crates/eggwork-test-node` helper (own lockfile, same immutable Eggwork
# revision): `eggwork-server` cannot link into this package's test binaries
# because its `rusqlite -> libsqlite3-sys 0.38` collides with
# `sqlx-sqlite -> libsqlite3-sys 0.28` (`links = "sqlite3"` must be unique
# per resolve graph). Production dependencies are unchanged.
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[features]
default = ["arboard"]
arboard = ["dep:arboard"]
plugins = ["wasmtime"]
debug-logging = []
server = [
    "axum",
    "http",
    "tower-http",
    "tokio-tungstenite",
    "tokio-stream",
    "socket2",
]
image = ["dep:ratatui-image", "dep:image"]
lsp-test-support = ["egglsp/lsp-test-support"]
lsp-real-server-tests = ["egglsp/lsp-real-server-tests"]
tool-advisor = []
tool-advisor-training = ["tool-advisor"]
tool-advisor-encoder-experiment = [
    "tool-advisor",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
]
tool-advisor-encoder-training = ["tool-advisor-encoder-experiment", "tool-advisor-training"]

[[test]]
name = "lsp_composite_stdio"
path = "tests/lsp_composite_stdio.rs"
required-features = ["lsp-test-support"]

[[test]]
name = "projection_transport_real"
path = "tests/projection_transport_real.rs"
required-features = ["server"]

[[test]]
name = "identity_m002_transport_auth"
path = "tests/identity_m002_transport_auth.rs"
required-features = ["server"]

[[test]]
name = "team_collaboration_m001_http_auth"
path = "tests/team_collaboration_m001_http_auth.rs"
required-features = ["server"]

[[test]]
name = "team_collaboration_m006_trajectory"
path = "tests/team_collaboration_m006_trajectory.rs"
required-features = ["server"]

[[test]]
name = "team_collaboration_postclosure_m001_registration_auth"
path = "tests/team_collaboration_postclosure_m001_registration_auth.rs"
required-features = ["server"]

# M003 pilot: consolidate the 11 `projection_replay_*` integration
# targets into one. Cargo does not auto-discover `tests/<dir>/mod.rs`
# as a test target, so the consolidated binary is declared explicitly.
# Per-file auto-discovery is suppressed by placing the moved sources
# under `tests/projection_replay/` with a `.inc` extension (Cargo only
# auto-discovers `*.rs`).
[[test]]
name = "projection_replay"
path = "tests/projection_replay/mod.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
codegen-units = 16

[profile.test]
opt-level = 0
codegen-units = 16
# Intentionally strips debuginfo for size; when triaging a test failure
# locally, restore backtraces with: RUSTFLAGS=-C debuginfo=2 cargo test ...
strip = "debuginfo"
