name: Windows process launcher

on:
  push:
    branches: [work/windows-native-sandbox-foundation]
    paths:
      - '.github/workflows/windows-process-launcher.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/managed_process.rs'
      - 'src/managed_process/**'
      - 'tests/windows_process_launcher.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-launcher:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Record Windows runner metadata
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption)"
          "Version: $($os.Version)"
          "Build: $($os.BuildNumber)"
          rustc --version --verbose

      - name: Windows managed process launcher tests
        run: cargo test --locked -p codegg --test windows_process_launcher -- --nocapture

      - name: Windows suspended-target failure injection
        run: cargo test --locked -p codegg --lib managed_process::windows::tests::failed_job_assignment_never_runs_the_suspended_target -- --nocapture

