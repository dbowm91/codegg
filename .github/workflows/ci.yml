name: CI

# Routine verification: one bounded job answering the ordinary development
# question — does this revision format, compile, lint, and pass the default
# workspace tests? Cheap authority guards (route disposition, audit
# coverage, scheduler bypass) run here as well as in `verify.sh quick`.
# Optional feature, plugin, example, LSP, and cross-platform checks
# remain available locally via scripts/verify.sh
# and the change-specific matrix in architecture/testing.md.
#
# CI economy policy (see architecture/testing.md "CI Structure"):
# concurrency cancels superseded runs on the same ref, docs-only changes
# skip the workflow via paths-ignore, linking uses mold, build jobs are
# tuned for the hosted runner (see env), and test execution runs under
# nextest profile `ci` (serial within each binary, parallel across).

on:
  pull_request:
    paths-ignore:
      # Docs-only changes cannot break code or guards (all guards verify
      # code -> docs direction). Asset sources stay gated: a change under
      # assets/agents/ or assets/prompts/ still triggers this workflow.
      - 'plans/**'
      - 'docs/**'
      - 'architecture/**'
      - '**.md'
      - '.opencode/skills/**'
  push:
    branches: [main]
    paths-ignore:
      - 'plans/**'
      - 'docs/**'
      - 'architecture/**'
      - '**.md'
      - '.opencode/skills/**'
  workflow_dispatch:

# Superseded runs never contribute signal: each push/PR-sync cancels the
# previous in-progress run on the same ref instead of burning a second
# full verifying job beside it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hosted runners have 4 vCPU / 16 GB. Build jobs are fixed at 4 ==
  # runner vCPUs (M001 disposition, retained final): 8 oversubscribes
  # the runner because each rustc already threads codegen internally
  # (codegen-units = 16), and 2 leaves headroom unused (historical
  # 28m37s at JOBS=2 vs 17m17s final main/live on run 36196068239).
  # Test execution slots match (nextest profile `ci` test-threads = 4). Local default stays 2
  # (see scripts/verify.sh) for smaller developer machines.
  # Test execution remains serial (--test-threads=1) in every mode.
  CARGO_BUILD_JOBS: 4

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # mold is a drop-in GNU-ld replacement, several times faster at
      # linking the large codegg test binaries that dominate CI compile
      # time. The test suite itself validates the linked output.
      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          # M002 WP2: the live-Eggwork helper is a workspace-excluded
          # standalone workspace (own lockfile, own target dir outside
          # the root target tree). Without this entry every run rebuilds
          # its eggwork-server dependency graph from scratch.
          workspaces: |
            . -> target
            crates/eggwork-test-node -> target

      # Prebuilt nextest binary (~10 s). Test execution uses profile `ci`
      # (.config/nextest.toml): serial within each binary (env mutation in
      # tests is process-global), parallel across binaries, run-alone for
      # the sleep-bound heavy files.
      - uses: taiki-e/install-action@nextest

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI Test"
          git config --global user.email "ci@test.example.com"

      - name: Validate agent TOML schema
        run: python3 scripts/generate_builtin_agents.py --check

      - name: Validate subagent name TOML schema
        run: python3 scripts/generate_subagent_names.py --check

      - name: codegg-core boundary guard
        run: ./scripts/check-core-boundary.sh

      - name: Sandbox contract guard
        run: python3 scripts/check_sandbox_contract.py

      - name: ADR identity and link guard
        run: python3 scripts/check_adr_integrity.py

      - name: Execution ownership guard
        run: python3 scripts/check_execution_ownership.py

      - name: Tool broker boundary self-test
        run: python3 scripts/check_tool_broker_boundary.py --self-test

      - name: Tool broker boundary guard
        run: python3 scripts/check_tool_broker_boundary.py
      # The daemon's turn code resolves its workspace root from the
      # execution context, never from the process working directory. The
      # guard covers `src/core/**` and the turn-code surfaces, plus the
      # `codegg-core` crate. A guard which is not run automatically cannot
      # protect anything.
      - name: Daemon working-directory usage guard (self-test)
        run: python3 scripts/check_daemon_cwd_usage.py --self-test

      - name: Daemon working-directory usage guard
        run: python3 scripts/check_daemon_cwd_usage.py

      # The trusted Git route owns every CodeGG-owned Git child. The
      # hostile-metadata detector is the mediation that refuses a
      # repository which declares a configuration surface the route cannot
      # neutralise, and the diff-consumer guard keeps every diff read
      # fenced by the generation-bound consistency contract. Both run with
      # their self-tests: a guard which is not run automatically cannot
      # protect anything, and a guard that cannot be shown to fail on an
      # injected defect is not evidence.
      - name: Git forbidden-pattern guard (self-test)
        run: python3 scripts/check_git_forbidden_patterns.py --self-test

      - name: Git forbidden-pattern guard
        run: python3 scripts/check_git_forbidden_patterns.py

      - name: Git consistency-consumer guard (self-test)
        run: python3 scripts/check_git_consistency_consumers.py --self-test

      - name: Git consistency-consumer guard
        run: python3 scripts/check_git_consistency_consumers.py

      - name: Contained worktree grant guard (self-test)
        run: python3 scripts/check_contained_worktree_grant.py --self-test

      - name: Contained worktree grant guard
        run: python3 scripts/check_contained_worktree_grant.py

      - name: Subagent notification-wiring guard (self-test)
        run: python3 scripts/check_subagent_notification_wiring.py --self-test

      - name: Subagent notification-wiring guard
        run: python3 scripts/check_subagent_notification_wiring.py

      - name: Delegated transcript-store guard (self-test)
        run: python3 scripts/check_delegated_transcript_store.py --self-test

      - name: Delegated transcript-store guard
        run: python3 scripts/check_delegated_transcript_store.py

      - name: Delegated continuation-authority guard (self-test)
        run: python3 scripts/check_delegated_continuation_authority.py --self-test

      - name: Delegated continuation-authority guard
        run: python3 scripts/check_delegated_continuation_authority.py

      - name: Projection disclosure guard (self-test)
        run: bash scripts/check_projection_disclosure.sh --self-test

      - name: Projection disclosure guard
        run: bash scripts/check_projection_disclosure.sh

      - name: Projection publication-seam guard (self-test)
        run: bash scripts/check_projection_publication_seam.sh --self-test

      - name: Projection publication-seam guard
        run: bash scripts/check_projection_publication_seam.sh

      - name: WebSocket bounds guard (self-test)
        run: python3 scripts/check_websocket_bounds.py --self-test

      - name: WebSocket bounds guard
        run: python3 scripts/check_websocket_bounds.py

      - name: Writer-fence completeness guard (self-test)
        run: python3 scripts/check_writer_fence_completeness.py --self-test

      - name: Writer-fence completeness guard
        run: python3 scripts/check_writer_fence_completeness.py

      - name: Checkout-mediation authority guard (self-test)
        run: python3 scripts/check_checkout_mediation_authority.py --self-test

      - name: Checkout-mediation authority guard
        run: python3 scripts/check_checkout_mediation_authority.py

      - name: TUI project authority guard
        run: python3 scripts/check_tui_project_authority.py

      - name: TUI editor text-authority guard
        run: python3 scripts/check_tui_editor_text_authority.py

      - name: TUI editor key-authority guard
        run: python3 scripts/check_tui_editor_key_authority.py

      - name: TUI editor leaf-authority guard
        run: python3 scripts/check_tui_editor_leaf_authority.py

      - name: TUI editor completion-authority guard
        run: python3 scripts/check_tui_editor_completion_authority.py

      - name: TUI editor apply-path guard
        run: python3 scripts/check_tui_editor_apply_path.py

      - name: TUI editor prefix-state guard
        run: python3 scripts/check_tui_editor_prefix_state.py

      - name: TUI editor doc-drift guard
        run: python3 scripts/check_tui_editor_doc_drift.py

      - name: TUI files keymap drift self-test
        run: python3 scripts/check_tui_files_keymap_drift.py --self-test

      - name: TUI files keymap drift guard
        run: python3 scripts/check_tui_files_keymap_drift.py

      - name: Comment budget guard self-test
        run: python3 scripts/check_comment_budget.py --self-test

      - name: Comment budget guard
        run: python3 scripts/check_comment_budget.py

      - name: TUI transport-authority guard
        run: python3 scripts/check_tui_transport_authority.py

      - name: Subagent name-pool isolation self-test
        run: python3 scripts/check_tui_subagent_name_pool_isolation.py --self-test

      - name: Subagent name-pool isolation guard
        run: python3 scripts/check_tui_subagent_name_pool_isolation.py

      - name: Composer key-ownership self-test
        run: python3 scripts/check_tui_composer_key_authority.py --self-test

      - name: Composer key-ownership guard
        run: python3 scripts/check_tui_composer_key_authority.py

      - name: Composer keymap drift self-test
        run: python3 scripts/check_tui_composer_keymap_drift.py --self-test

      - name: Composer keymap drift guard
        run: python3 scripts/check_tui_composer_keymap_drift.py

      - name: Nested runtime block_on self-test
        run: python3 scripts/check_no_nested_runtime_block_on.py --self-test

      - name: Nested runtime block_on guard
        run: python3 scripts/check_no_nested_runtime_block_on.py
      - name: Command argument contract self-test
        run: python3 scripts/check_command_argument_contract.py --self-test

      - name: Command argument contract guard
        run: python3 scripts/check_command_argument_contract.py

      - name: TUI render cost self-test
        run: python3 scripts/check_tui_render_cost.py --self-test

      - name: TUI render cost guard
        run: python3 scripts/check_tui_render_cost.py

      - name: HTTP route disposition guard
        run: python3 scripts/check_http_route_disposition.py

      - name: Audit coverage guard
        run: python3 scripts/check_audit_coverage.py

      - name: Queue delivery callsite guard
        run: python3 scripts/check_queue_delivery_callsites.py

      - name: Queue write transaction shape guard
        run: python3 scripts/check_queue_write_transaction_shape.py

      - name: Scheduler bypass guard
        run: python3 scripts/check_scheduler_bypass.py

      - name: Config merge coverage guard
        run: python3 scripts/check_config_merge_coverage.py

      - name: Reasoning intent fidelity self-test
        run: python3 scripts/check_reasoning_intent_fidelity.py --self-test

      - name: Reasoning intent fidelity guard
        run: python3 scripts/check_reasoning_intent_fidelity.py

      - name: Open reasoning vocabulary self-test
        run: python3 scripts/check_reasoning_vocabulary_open.py --self-test

      - name: Open reasoning vocabulary guard
        run: python3 scripts/check_reasoning_vocabulary_open.py

      - name: Model profile capability mirror self-test
        run: python3 scripts/check_model_profile_capability_mirror.py --self-test

      - name: Model profile capability mirror guard
        run: python3 scripts/check_model_profile_capability_mirror.py

      - name: TUI reasoning surface self-test
        run: python3 scripts/check_tui_reasoning_surface.py --self-test

      - name: TUI reasoning surface guard
        run: python3 scripts/check_tui_reasoning_surface.py

      - name: No hardcoded model catalog guard
        run: python3 scripts/check_no_hardcoded_models.py

      # A difference between the dev and test cargo profiles makes the same
      # crate compile twice — once for `cargo build`, once for `cargo test`.
      - name: Cargo profile alignment guard
        run: python3 scripts/check_cargo_profile_alignment.py

      - name: Cargo profile alignment guard self-test
        run: python3 scripts/check_cargo_profile_alignment.py --self-test

      # The ownership manifest and the target-name filters must agree with
      # the tree: a filter that names a renamed test target silently stops
      # reserving the runner for it.
      - name: Test ownership guard
        run: python3 scripts/check_test_ownership.py

      - name: Test ownership guard self-test
        run: python3 scripts/check_test_ownership.py --self-test

      # The scoped mode's selection algorithm and its `members` output format.
      # The caller reads that format with a tab-separated read, so a column
      # that moves is a scope that silently changes.
      - name: Scoped selection self-test
        run: python3 scripts/scoped_selection.py --self-test

      - name: Test target reference guard
        run: python3 scripts/check_test_target_references.py

      - name: Test target reference guard self-test
        run: python3 scripts/check_test_target_references.py --self-test

      # Every test body must assert something checkable, and no two test
      # bodies may assert the same thing twice unless the decision table
      # records the survivor.
      - name: Test assertion quality guard
        run: python3 scripts/check_test_assertion_quality.py

      - name: Test assertion quality guard self-test
        run: python3 scripts/check_test_assertion_quality.py --self-test

      - name: Test duplication guard
        run: python3 scripts/check_test_duplication.py

      - name: Test duplication guard self-test
        run: python3 scripts/check_test_duplication.py --self-test

      # The Tool Program pipeline is parse-only. Three test functions that
      # could not fail used to "enforce" it; this guard replaces them.
      - name: Tool Program parse-only guard
        run: python3 scripts/check_tool_program_parse_only.py

      - name: Tool Program parse-only guard self-test
        run: python3 scripts/check_tool_program_parse_only.py --self-test

      # `JobState::is_terminal()` is the terminality authority; every
      # projection of a job state has to agree with it.
      - name: Job-state terminality agreement guard
        run: python3 scripts/check_job_state_terminality_agreement.py

      - name: Job-state terminality agreement guard self-test
        run: python3 scripts/check_job_state_terminality_agreement.py --self-test

      - name: Shell policy test-safety guard
        run: python3 scripts/check_shell_policy_test_safety.py

      - name: Destructive risk signal coverage guard
        run: python3 scripts/check_destructive_risk_signal_coverage.py

      - name: Destructive risk signal coverage guard self-test
        run: python3 scripts/check_destructive_risk_signal_coverage.py --self-test

      - name: Shell policy test-safety fixtures
        run: python3 scripts/test_shell_policy_test_safety.py

      - name: Harness Lab Python suite
        run: python3 -m unittest discover -s dev/harness_lab/tests

      - name: Security test-filter execution control (self-test)
        run: python3 scripts/check_test_filter_execution.py --self-test

      - name: Security test-filter execution control
        run: python3 scripts/check_test_filter_execution.py

      - name: Self-re-exec test path control (self-test)
        run: python3 scripts/check_test_self_reexec_paths.py --self-test

      - name: Self-re-exec test path control
        run: python3 scripts/check_test_self_reexec_paths.py

      - name: Shared helper-tree binding control (self-test)
        run: python3 scripts/check_test_common_binding.py --self-test

      - name: Shared helper-tree binding control
        run: python3 scripts/check_test_common_binding.py

      - name: Writer disposition guard
        run: python3 scripts/check_writer_disposition.py

      - name: Writer disposition guard self-test
        run: python3 scripts/check_writer_disposition.py --self-test

      - name: Process denial guard
        run: python3 scripts/check_process_denial.py

      - name: Process denial guard self-test
        run: python3 scripts/check_process_denial.py --self-test

      - name: Shared checkout guard
        run: python3 scripts/check_shared_checkout.py

      - name: Shared checkout guard self-test
        run: python3 scripts/check_shared_checkout.py --self-test

      - name: Blackboard contract matrix guard
        run: python3 scripts/check_blackboard_contract_matrix.py

      - name: Blackboard contract matrix guard self-test
        run: python3 scripts/check_blackboard_contract_matrix.py --self-test

      - name: Formatting
        run: cargo fmt --check --all

      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Detect live-Eggwork relevance
        id: live
        run: |
          ./scripts/detect-live-eggwork-changes.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.base.ref }}" | tee /tmp/live-detect.log
          echo "live_required=$(tail -n 1 /tmp/live-detect.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # M002 WP1: build the workspace-excluded Eggwork fixtures once so
      # per-test processes assert on prebuilt binaries (via
      # CODEGG_EGGWORK_FIXTURES_PREBUILT=1) instead of each
      # discovering/rebuilding them. Skipped when the live target is
      # omitted from this run (unrelated PRs).
      - name: Prebuild Eggwork live fixtures
        if: steps.live.outputs.live_required == 'true'
        run: |
          ./scripts/prebuild-eggwork-fixtures.sh
          echo "CODEGG_EGGWORK_TEST_NODE=$PWD/crates/eggwork-test-node/target/debug/codegg-eggwork-test-node" >> "$GITHUB_ENV"
          echo "CODEGG_EGGWORK_FIXTURES_PREBUILT=1" >> "$GITHUB_ENV"

      # Constrained Linux integration tests resolve this managed sidecar from
      # the target profile directory shared with their Cargo `deps` binaries.
      # Product builds still resolve only their installation-owned sibling.
      - name: Build trusted sandbox helper for integration tests
        run: |
          cargo build --locked --bin codegg-sandbox-helper
          cp target/debug/codegg-sandbox-helper target/debug/deps/codegg-sandbox-helper

      - name: Workspace tests
        env:
          # The scratch allocator refuses a per-user cache root another user
          # could write to. The sweep gets a private cache root of its own so
          # its result is a property of the product rather than of the runner's
          # home directory, and the root stays outside every workspace root the
          # tests grant.
          XDG_CACHE_HOME: ${{ runner.temp }}/codegg-sweep-cache
        run: |
          if [ "${{ steps.live.outputs.live_required }}" = "true" ]; then
            echo "Live Eggwork qualification included (relevant change or main push)."
            cargo nextest run --workspace --locked --profile ci
          else
            echo "Live Eggwork target omitted for this unrelated-PR run; it stays qualified via relevant-PR and main runs."
            cargo nextest run --workspace --locked --profile ci -E 'not binary(eggwork_remote_execution_live)'
          fi
