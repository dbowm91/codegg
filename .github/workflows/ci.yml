name: CI

# Routine verification: one bounded job answering the ordinary development
# question — does this revision format, compile, lint, and pass the default
# workspace tests? Cheap authority guards (route disposition, audit
# coverage, scheduler bypass) run here as well as in `verify.sh quick`.
# Optional feature, plugin, example, LSP, and cross-platform checks
# remain available locally via scripts/verify.sh
# and the change-specific matrix in architecture/testing.md.
#
# CI economy policy (see architecture/testing.md "CI Structure"):
# concurrency cancels superseded runs on the same ref, docs-only changes
# skip the workflow via paths-ignore, linking uses mold, build jobs are
# tuned for the hosted runner (see env), and test execution runs under
# nextest profile `ci` (serial within each binary, parallel across).

on:
  pull_request:
    paths-ignore:
      # Docs-only changes cannot break code or guards (all guards verify
      # code -> docs direction). Asset sources stay gated: a change under
      # assets/agents/ or assets/prompts/ still triggers this workflow.
      - 'plans/**'
      - 'docs/**'
      - 'architecture/**'
      - '**.md'
      - '.opencode/skills/**'
  push:
    branches: [main]
    paths-ignore:
      - 'plans/**'
      - 'docs/**'
      - 'architecture/**'
      - '**.md'
      - '.opencode/skills/**'

# Superseded runs never contribute signal: each push/PR-sync cancels the
# previous in-progress run on the same ref instead of burning a second
# full verifying job beside it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hosted runners have 4 vCPU / 16 GB. Build jobs are fixed at 4 ==
  # runner vCPUs (M001 disposition): 8 oversubscribes the runner because
  # each rustc already threads codegen internally (codegen-units = 16),
  # and 2 leaves headroom unused (28m37s at JOBS=2 vs ~19 min steady
  # state at higher concurrency). Test execution slots match (nextest
  # profile `ci` test-threads = 4). Local default stays 2
  # (see scripts/verify.sh) for smaller developer machines.
  # Test execution remains serial (--test-threads=1) in every mode.
  CARGO_BUILD_JOBS: 4

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # mold is a drop-in GNU-ld replacement, several times faster at
      # linking the large codegg test binaries that dominate CI compile
      # time. The test suite itself validates the linked output.
      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          # M002 WP2: the live-Eggwork helper is a workspace-excluded
          # standalone workspace (own lockfile, own target dir outside
          # the root target tree). Without this entry every run rebuilds
          # its eggwork-server dependency graph from scratch.
          workspaces: |
            . -> target
            crates/eggwork-test-node -> target

      # Prebuilt nextest binary (~10 s). Test execution uses profile `ci`
      # (.config/nextest.toml): serial within each binary (env mutation in
      # tests is process-global), parallel across binaries, run-alone for
      # the sleep-bound heavy files.
      - uses: taiki-e/install-action@nextest

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI Test"
          git config --global user.email "ci@test.example.com"

      - name: Validate agent TOML schema
        run: python3 scripts/generate_builtin_agents.py --check

      - name: codegg-core boundary guard
        run: ./scripts/check-core-boundary.sh

      - name: Sandbox contract guard
        run: python3 scripts/check_sandbox_contract.py

      - name: Execution ownership guard
        run: python3 scripts/check_execution_ownership.py

      - name: TUI project authority guard
        run: python3 scripts/check_tui_project_authority.py

      - name: HTTP route disposition guard
        run: python3 scripts/check_http_route_disposition.py

      - name: Audit coverage guard
        run: python3 scripts/check_audit_coverage.py

      - name: Scheduler bypass guard
        run: python3 scripts/check_scheduler_bypass.py

      - name: Formatting
        run: cargo fmt --check --all

      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Detect live-Eggwork relevance
        id: live
        run: |
          ./scripts/detect-live-eggwork-changes.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}" | tee /tmp/live-detect.log
          echo "live_required=$(tail -n 1 /tmp/live-detect.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # M002 WP1: build the workspace-excluded Eggwork fixtures once so
      # per-test processes assert on prebuilt binaries (via
      # CODEGG_EGGWORK_FIXTURES_PREBUILT=1) instead of each
      # discovering/rebuilding them. Skipped when the live target is
      # omitted from this run (unrelated PRs).
      - name: Prebuild Eggwork live fixtures
        if: steps.live.outputs.live_required == 'true'
        run: |
          ./scripts/prebuild-eggwork-fixtures.sh
          echo "CODEGG_EGGWORK_TEST_NODE=$PWD/crates/eggwork-test-node/target/debug/codegg-eggwork-test-node" >> "$GITHUB_ENV"
          echo "CODEGG_EGGWORK_FIXTURES_PREBUILT=1" >> "$GITHUB_ENV"

      - name: Workspace tests
        run: |
          if [ "${{ steps.live.outputs.live_required }}" = "true" ]; then
            echo "Live Eggwork qualification included (relevant change or main push)."
            cargo nextest run --workspace --locked --profile ci
          else
            echo "Live Eggwork target omitted for this unrelated-PR run; it stays qualified via relevant-PR and main runs."
            cargo nextest run --workspace --locked --profile ci -E 'not binary(eggwork_remote_execution_live)'
          fi
