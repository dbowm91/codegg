name: CI

# Routine verification: one bounded job answering the ordinary development
# question — does this revision format, compile, lint, and pass the default
# workspace tests? Optional feature, plugin, example, LSP, audit, and
# cross-platform checks remain available locally and will be canonically
# documented by Milestone 002.

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Validate agent TOML schema
        run: python3 scripts/generate_builtin_agents.py --check

      - name: Check builtin agents match source
        run: python3 scripts/check_builtin_agents.py

      - name: Tokio test-flavor regression guard
        run: python3 scripts/check-tokio-test-flavors.py

      - name: codegg-core boundary guard
        run: ./scripts/check-core-boundary.sh

      - name: Formatting
        run: cargo fmt --check --all

      - name: Workspace check
        run: cargo check --workspace --all-targets --locked

      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --locked -- --test-threads=1
