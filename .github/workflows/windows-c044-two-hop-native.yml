name: Windows C044 native two-hop diagnostic (test only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-c044-two-hop-native.yml'
      - 'scripts/windows_c044_two_hop_native.ps1'
      - 'research/windows-native-sandbox/two-hop-native-diagnostic/**'
      - 'plans/implementation/windows-native-sandbox/044-compiled-native-two-hop-launch-diagnostic.md'

permissions:
  contents: read

jobs:
  two-hop-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Record Windows runner metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          $current = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $evidence = [ordered]@{
            edition = $os.Caption
            version = $os.Version
            build = [int]$current.CurrentBuild
            ubr = [int]$current.UBR
            architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            git_sha = '${{ github.sha }}'
            workflow_run_id = '${{ github.run_id }}'
            qualification = 'Hosted disposable-runner diagnostic only; not an independent security admission.'
          }
          $json = $evidence | ConvertTo-Json -Compress
          "C044_HOST=$json"
          $json | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Record disposable runner privilege evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdministrator = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $groups = whoami /groups
          $highIntegrity = [bool]($groups | Select-String 'S-1-16-12288')
          if (-not $isAdministrator -or -not $highIntegrity) {
            throw 'C044 requires an elevated administrator token on its disposable Windows runner.'
          }
          "C044 admin consent: Administrator=$isAdministrator HighIntegrity=$highIntegrity" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Build native first-instruction probe and record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'research/windows-native-sandbox/two-hop-native-diagnostic/native_probe.c'
          $probe = Join-Path $env:RUNNER_TEMP 'codegg-c044-native-probe.exe'
          # /MT statically links the CRT so the restricted child loads only
          # the probe file (explicit limiting-SID grant) plus KnownDLLs
          # (kernel32/advapi32); no system32/WinSxS CRT file opens that the
          # restricting SID is not granted.
          cl.exe /nologo /MT /O1 /GS /sdl /W4 /DUNICODE /D_UNICODE /Fe:$probe $source advapi32.lib
          if ($LASTEXITCODE -ne 0) { throw "cl.exe failed: $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 $probe).Hash
          $object = Join-Path $env:RUNNER_TEMP 'c044-version.obj'
          $compiler = (& cl.exe /Bv /nologo /c $source "/Fo:$object" 2>&1 | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($compiler)) { throw 'Compiler version evidence is missing.' }
          "C044_NATIVE_PROBE=$probe" | Add-Content -LiteralPath $env:GITHUB_ENV
          "C044_PROBE_SHA256=$hash" | Add-Content -LiteralPath $env:GITHUB_ENV
          "C044_PROBE_COMPILER=$compiler" | Add-Content -LiteralPath $env:GITHUB_ENV
          "C044 probe SHA256=$hash compiler=$compiler" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Build and test portable harness logic
        shell: pwsh
        run: |
          cargo test --locked --manifest-path research/windows-native-sandbox/two-hop-native-diagnostic/Cargo.toml -- --nocapture

      - name: Run bounded native two-hop synthetic fixture
        shell: pwsh
        run: |
          $console = Join-Path $env:RUNNER_TEMP 'codegg-c044-console.txt'
          ./scripts/windows_c044_two_hop_native.ps1 2>&1 | Tee-Object -FilePath $console
          if ($LASTEXITCODE -ne 0) { throw "C044 diagnostic script failed: $LASTEXITCODE" }
          $line = Get-Content $console | Where-Object { $_ -like 'C044_REPORT=*' } | Select-Object -Last 1
          if (-not $line) { throw 'C044 produced no machine-readable report.' }
          $report = $line.Substring('C044_REPORT='.Length) | ConvertFrom-Json
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'codegg-c044-report.json')
          $outcome = [string]$report.outcome
          "C044 outcome: $outcome" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($outcome -eq 'control-failed') { throw 'C044 first-hop control read failed; the run is invalid, not a denial result.' }

      - name: Upload redacted C044 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-c044-two-hop-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codegg-c044-report.json
            ${{ runner.temp }}/codegg-c044-console.txt
          if-no-files-found: warn
          retention-days: 30
