name: Desktop E2E

# Built-app visible-window qualification for the desktop foundation (C003).
# Runs the real Tauri window (embedded WebDriver provider) against an
# isolated daemon: rendered state, real IPC Channel invalidation, visible
# reconnect, renderer reload, native close, TUI coexistence, explicit
# autostart, and daemon survival.
#
# Root `CI / verify` intentionally has no Tauri/Node/WebKit dependency; this
# path-gated workflow owns the display-backed qualification instead. Linux
# (WebKitGTK + xvfb) is the routine hosted qualification. Windows remains
# M002-gated; macOS runs stay valuable local evidence.
#
# ── RESTORED 2026-10-24 ─────────────────────────────────────────────────────
# The lane was paused on 2026-10-23 because it was red on `main`: run
# 39679968444 at 53d9fc9fd failed with
#
#   element ("[data-testid="permission-list"]") still not existing after 120000ms
#   at apps/desktop/e2e/specs/m004-session.e2e.ts:169:5
#
# The cause was a stale *fixture* premise, not a product defect. The desktop
# fixture's mock model answered the first `write` call with its final text,
# but since 39e1445b6 the daemon answers a temp-root write with an actionable
# scratch-path redirect *before* asking the human, and only reaches the human
# when the model repeats the same restricted path. The fixture therefore never
# produced the `PermissionPending` the spec asserts, so the spec waited out
# its timeout on a permission that was never going to arrive.
#
# The fixture now repeats the same denied write on its second request, which
# exercises the intended one-offer-per-target rule: the first attempt is
# answered with the redirect, the repeat reaches the human, and the spec's
# `permission-list` assertion holds. The product behaviour is unchanged.
#
# The triggers are restored with the path filters preserved at the pause.
#
# The checks below run through apps/desktop/scripts/verify-desktop.sh — the
# one local entry point that owns the desktop step list — so the hosted lane
# and the maintainer's machine cannot drift. The script is what a contributor
# runs before pushing; this workflow is what runs it for them. The lane's
# lint gate is also stated literally in the host-checks step, because that
# is where the gate guard reads it from; the script proves the two copies
# still agree.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'crates/codegg-client/**'
      - 'crates/codegg-protocol/**'
      - 'crates/codegg-core/src/projection_replay/**'
      - 'crates/codegg-core/src/storage/**'
      - 'src/core/transport/**'
      - 'src/core/daemon_turns.rs'
      - 'src/core/daemon_projects.rs'
      - 'src/core/daemon.rs'
      - '.github/workflows/desktop-e2e.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/codegg-client/**'
      - 'crates/codegg-protocol/**'
      - 'crates/codegg-core/src/projection_replay/**'
      - 'crates/codegg-core/src/storage/**'
      - 'src/core/transport/**'
      - 'src/core/daemon_turns.rs'
      - 'src/core/daemon_projects.rs'
      - 'src/core/daemon.rs'
      - '.github/workflows/desktop-e2e.yml'
  workflow_dispatch:

# Pinned to 24.04: Tauri 2.12 documents WebKitGTK 4.1 system dependencies
# there, and ubuntu-latest is migrating to 26 (see CI annotations).
concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Node is pinned to a currently supported LTS, not inherited ambient.
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Rust 1.90.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0

      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            ripgrep

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI Test"
          git config --global user.email "ci@test.example.com"

      # ── The desktop gate ────────────────────────────────────────────────
      # The checks below run through apps/desktop/scripts/verify-desktop.sh:
      # one entry point owns the step list, so the hosted lane and the
      # maintainer's machine (the same script, run locally) cannot drift.
      # The script prints its own step-by-step log and says which steps it
      # skipped and why.

      - name: Desktop production boundary guard
        run: apps/desktop/scripts/verify-desktop.sh boundary

      - name: Build root daemon binary
        # The root workspace strips debuginfo in BOTH the dev and test cargo
        # profiles so the two resolve identically and the dependency graph is
        # compiled once (scripts/check_cargo_profile_alignment.py). This binary
        # is bundled into the desktop app, so keep its debug info for crash
        # symbolication: override the profile for this one invocation.
        run: cargo build --locked --config 'profile.dev.strip="none"'

      - name: Desktop renderer checks
        run: apps/desktop/scripts/verify-desktop.sh renderer

      # tauri.conf.json bundles binaries/codegg as a resource; the Tauri
      # build script requires it to exist. Stage this revision's binary
      # (gitignored; C001 operator contract).
      - name: Stage daemon resource for the desktop bundle
        env:
          CODEGG_DAEMON_EXECUTABLE: ${{ github.workspace }}/target/debug/codegg
        run: apps/desktop/scripts/verify-desktop.sh stage-daemon

      - name: Desktop host checks (production configuration)
        run: |
          # This lane's lint gate, in the pinned toolchain. The script's
          # `host` phase runs the same three host commands (test, fmt and
          # this lint) and proves they still agree with this file, so the
          # local gate and this lane cannot drift.
          rustup run 1.90.0 cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          apps/desktop/scripts/verify-desktop.sh host

      # Builds the fixture helper plus the desktop-e2e feature app binary
      # (the only configuration containing the embedded WebDriver server),
      # then runs the visible-window trajectory under a fake display (the
      # script uses xvfb when the runner has no display of its own, and
      # skips the step with the reason when it has none at all).
      # CODEGG_DAEMON_EXECUTABLE pins the daemon to this revision.
      - name: Built-app WebDriver trajectory
        env:
          CODEGG_DAEMON_EXECUTABLE: ${{ github.workspace }}/target/debug/codegg
        run: apps/desktop/scripts/verify-desktop.sh e2e

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-logs
          path: apps/desktop/e2e/logs/
          if-no-files-found: warn
