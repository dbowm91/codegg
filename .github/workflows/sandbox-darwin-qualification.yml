name: Sandbox Darwin Qualification (one-shot)

on:
  push:
    branches:
      - planning/sandbox-containment-post-closure-corrective

permissions:
  contents: read

jobs:
  seatbelt:
    # C004 requires qualification on native Apple Silicon as well as Linux.
    # GitHub's macos-15 standard runner is an M1 arm64 host.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record native host and Seatbelt availability
        run: |
          sw_vers
          uname -a
          uname -m
          test -x /usr/bin/sandbox-exec
      - name: Qualify real Seatbelt helper containment
        run: cargo test -p codegg --test sandbox_containment -- --test-threads=1 --nocapture
      - name: Qualify Python execution modes
        run: cargo test -p codegg --lib python_script::executor::tests -- --test-threads=1 --nocapture
      - name: Qualify managed scratch lifecycle
        run: cargo test -p codegg --lib managed_process::tests::constrained_launch_gets_private_tmpdir_removed_after_reap -- --test-threads=1 --nocapture
      - name: Qualify process-tree cancellation and timeout
        run: cargo test -p codegg --lib managed_process::tests::timeout_and_cancellation_kill_the_process_group -- --test-threads=1 --nocapture
      - name: Qualify fail-closed private status handling
        run: cargo test -p codegg --lib managed_process::tests::missing_private_status_fails_closed_with_test_only_helper_injection -- --test-threads=1 --nocapture
      - name: Qualify hardlink deny preflight
        run: cargo test -p codegg --lib managed_process::tests::hardlinked_denied_path_fails_before_target_launch -- --test-threads=1 --nocapture
      - name: Run sandbox contract guards
        run: |
          python3 scripts/check_sandbox_contract.py
          python3 scripts/check_sandbox_policy_wiring.py
