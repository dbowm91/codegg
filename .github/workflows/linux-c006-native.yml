name: Linux C006 protected mount qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-c006-native.yml'
      - 'src/bin/codegg-sandbox-helper.rs'
      - 'src/managed_process.rs'
      - 'src/security/sandbox.rs'
      - 'src/security/sandbox/**'
      - 'tests/linux_bubblewrap_first_hop.rs'
  push:
    paths:
      - '.github/workflows/linux-c006-native.yml'
      - 'src/bin/codegg-sandbox-helper.rs'
      - 'src/managed_process.rs'
      - 'src/security/sandbox.rs'
      - 'src/security/sandbox/**'
      - 'tests/linux_bubblewrap_first_hop.rs'

permissions:
  contents: read

concurrency:
  group: linux-c006-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-mount:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 4
      CODEGG_RUN_C006_BWRAP_NATIVE: '1'
      CODEGG_RUN_C009_BWRAP_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Record native runner capabilities
        run: |
          uname -a
          bwrap --version
          id
          cat /proc/sys/user/max_user_namespaces
          printf 'AppArmor profile: '
          cat /proc/self/attr/current || true
          printf 'Bubblewrap mode: '
          stat -c '%a %u %n' "$(command -v bwrap)"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true

      - name: Enable user namespaces for isolated native qualification
        run: |
          # GitHub-hosted Ubuntu 24.04 enables AppArmor's unprivileged-userns
          # restriction. This runner is an ephemeral VM; relax only that
          # host gate so the test can qualify Bubblewrap's mount setup. The
          # tested CodeGG child remains unprivileged and confined by bwrap.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true

      - name: Build trusted sandbox helper
        run: cargo build --locked --bin codegg-sandbox-helper

      - name: ManagedProcessService protected-mount qualification
        run: cargo test --locked --lib protected_mount_view -- --nocapture
