name: Linux isolation hosted-runner capability probe (one-shot)

on:
  push:
    branches:
      - planning/linux-execution-isolation-full
    paths:
      - '.github/workflows/linux-isolation-host-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Linux isolation mechanisms without executing untrusted code
        shell: bash
        run: |
          set +e
          uname -a
          id
          cat /proc/sys/user/max_user_namespaces || true
          cat /proc/self/cgroup || true
          cat /sys/fs/cgroup/cgroup.controllers || true
          stat -c '%U %G %A %n' /sys/fs/cgroup 2>&1 || true
          python3 - <<'PY'
          import ctypes, os
          libc = ctypes.CDLL(None, use_errno=True)
          abi = libc.syscall(444, ctypes.c_void_p(), 0, 1)
          print(f"landlock_abi={abi} errno={ctypes.get_errno()}")
          PY
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version
          sudo bwrap --unshare-user --unshare-pid --unshare-ipc --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 -- /bin/true
          echo "privileged_namespace_status=$?"
          python3 - <<'PY'
          import pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory(prefix="codegg-overlay-probe-") as base:
              root = pathlib.Path(base)
              lower, upper, work = (root / name for name in ("lower", "upper", "work"))
              for path in (lower, upper, work):
                  path.mkdir()
              subprocess.run(["sudo", "chown", "-R", "0:0", str(root)], check=True)
              (lower / "baseline").write_text("baseline")
              script = "mount -t overlay overlay -o lowerdir=/lower,upperdir=/upper,workdir=/work,userxattr,redirect_dir=off,index=off,metacopy=off /merged && printf upper > /merged/created"
              args = ["sudo", "bwrap", "--unshare-user", "--uid", "0", "--gid", "0", "--cap-add", "CAP_SYS_ADMIN", "--ro-bind", str(lower), "/lower", "--bind", str(upper), "/upper", "--bind", str(work), "/work", "--dir", "/merged", "--ro-bind", "/usr", "/usr", "--ro-bind", "/bin", "/bin", "--ro-bind", "/lib", "/lib", "--ro-bind", "/lib64", "/lib64", "--ro-bind", "/etc", "/etc", "--dev", "/dev", "--proc", "/proc", "--", "/bin/sh", "-c", script]
              result = subprocess.run(args, text=True, capture_output=True)
              print(f"overlay_mount_status={result.returncode}")
              print(f"overlay_mount_stderr={result.stderr.strip()}")
              print(f"overlay_upper_written={(upper / 'created').exists()}")
          PY
