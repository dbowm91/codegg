name: Linux isolation hosted-runner capability probe (one-shot)

on:
  push:
    branches:
      - planning/linux-execution-isolation-full
    paths:
      - '.github/workflows/linux-isolation-host-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Linux isolation mechanisms without executing untrusted code
        shell: bash
        run: |
          set +e
          uname -a
          id
          cat /proc/sys/user/max_user_namespaces || true
          cat /proc/self/cgroup || true
          cat /sys/fs/cgroup/cgroup.controllers || true
          stat -c '%U %G %A %n' /sys/fs/cgroup 2>&1 || true
          set -e
          python3 - <<'PY'
          import ctypes, os
          libc = ctypes.CDLL(None, use_errno=True)
          abi = libc.syscall(444, ctypes.c_void_p(), 0, 1)
          print(f"landlock_abi={abi} errno={ctypes.get_errno()}")
          PY
          python3 - <<'PY'
          import socket, subprocess, sys, threading, uuid
          name = "codegg-landlock-scope-" + uuid.uuid4().hex
          listener = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          listener.bind("\0" + name)
          listener.listen(1)
          listener.settimeout(1)
          accepted = []
          def accept_once():
              try:
                  connection, _ = listener.accept()
                  accepted.append(True)
                  connection.close()
              except TimeoutError:
                  pass
          thread = threading.Thread(target=accept_once)
          thread.start()
          script = r'''import ctypes, errno, socket, sys
          class Attr(ctypes.Structure):
              _fields_ = [("handled_access_fs", ctypes.c_uint64), ("handled_access_net", ctypes.c_uint64), ("scoped", ctypes.c_uint64)]
          libc = ctypes.CDLL(None, use_errno=True)
          attr = Attr(0, 0, 3)
          fd = libc.syscall(444, ctypes.byref(attr), ctypes.sizeof(attr), 0)
          if fd < 0: raise OSError(ctypes.get_errno(), "landlock_create_ruleset")
          if libc.prctl(38, 1, 0, 0, 0) != 0: raise OSError(ctypes.get_errno(), "PR_SET_NO_NEW_PRIVS")
          if libc.syscall(446, fd, 0) != 0: raise OSError(ctypes.get_errno(), "landlock_restrict_self")
          try:
              socket.socket(socket.AF_UNIX, socket.SOCK_STREAM).connect("\0" + sys.argv[1])
              raise SystemExit("abstract socket unexpectedly reachable")
          except PermissionError as error:
              if error.errno not in (errno.EPERM, errno.EACCES): raise
              print(f"abstract_socket_denied_errno={error.errno}")
          '''
          result = subprocess.run([sys.executable, "-c", script, name], text=True, capture_output=True)
          thread.join()
          listener.close()
          print(f"landlock_scope_child_status={result.returncode}")
          print(f"landlock_scope_child_stdout={result.stdout.strip()}")
          print(f"landlock_scope_child_stderr={result.stderr.strip()}")
          print(f"landlock_scope_host_listener_accepted={bool(accepted)}")
          if result.returncode != 0 or "abstract_socket_denied_errno=" not in result.stdout or accepted:
              raise SystemExit("Landlock ABI 6 abstract socket scope did not deny the host fixture")
          PY
          set +e
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version
          sudo bwrap --unshare-user --unshare-pid --unshare-ipc --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 -- /bin/true
          echo "privileged_namespace_status=$?"
          python3 - <<'PY'
          import pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory(prefix="codegg-overlay-probe-") as base:
              root = pathlib.Path(base)
              lower, upper, work = (root / name for name in ("lower", "upper", "work"))
              for path in (lower, upper, work):
                  path.mkdir()
              root.chmod(0o755)
              for path in (lower,):
                  path.chmod(0o755)
              for path in (upper, work):
                  path.chmod(0o777)
              (lower / "baseline").write_text("baseline")
              script = "mount -t overlay overlay -o lowerdir=/lower,upperdir=/upper,workdir=/work,userxattr,redirect_dir=off,index=off,metacopy=off /merged && printf upper > /merged/created"
              args = ["sudo", "bwrap", "--unshare-user", "--uid", "0", "--gid", "0", "--cap-add", "CAP_SYS_ADMIN", "--ro-bind", str(lower), "/lower", "--bind", str(upper), "/upper", "--bind", str(work), "/work", "--dir", "/merged", "--ro-bind", "/usr", "/usr", "--ro-bind", "/bin", "/bin", "--ro-bind", "/lib", "/lib", "--ro-bind", "/lib64", "/lib64", "--ro-bind", "/etc", "/etc", "--dev", "/dev", "--proc", "/proc", "--", "/bin/sh", "-c", script]
              result = subprocess.run(args, text=True, capture_output=True)
              print(f"overlay_mount_status={result.returncode}")
              print(f"overlay_mount_stderr={result.stderr.strip()}")
              print(f"overlay_upper_written={(upper / 'created').exists()}")
          PY
