name: Linux M004 process and IPC qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-m004-native.yml'
      - 'src/bin/codegg-sandbox-helper.rs'
      - 'src/managed_process.rs'
      - 'src/interactive_process.rs'
      - 'src/lsp/**'
      - 'src/agent/turn_runtime.rs'
      - 'src/tool/mod.rs'
      # C002: the Tool Program delegated-child route carries the accepted
      # network intent and sandbox ceiling. A change to either the tool
      # boundary that stamps them or the executor that binds them must be
      # able to trigger this qualification job.
      - 'src/tool/tool_program.rs'
      - 'src/tool/tool_program_context.rs'
      # M005 owner surface: the network intent, the durable payloads that
      # carry it, and every launch owner that has to refuse when it cannot
      # honor an offline request. A change to any of these must be able to
      # trigger this qualification job.
      - 'crates/codegg-core/src/approval.rs'
      - 'crates/codegg-core/src/authorization/**'
      - 'crates/codegg-core/src/jobs/**'
      - 'crates/codegg-core/src/session/schema.rs'
      - 'crates/codegg-protocol/src/core.rs'
      - 'src/agent/**'
      - 'src/core/**'
      - 'src/interactive_process_attach.rs'
      - 'src/python_script/**'
      - 'src/scheduler/**'
      - 'src/tool/bash.rs'
      - 'src/tool/bash/**'
      - 'src/tool/test.rs'
      - 'src/tool/python_script.rs'
      - 'crates/egglsp/src/client.rs'
      - 'crates/egglsp/src/launch.rs'
      - 'crates/egglsp/src/runtime.rs'
      - 'crates/egglsp/src/service.rs'
      - 'src/security/sandbox.rs'
      - 'src/security/sandbox/**'
      - 'tests/linux_git_test_support/linux_m004_process_ipc.inc'
      - 'tests/interactive_process_attach_resume/interactive_process_attach_resume.inc'
      # C007 publisher surface: the private-index staging, the durable
      # journal, the compare-and-swap publication, and the startup
      # reconciler. A change to any of these must be able to trigger this
      # qualification job, because the contained staging step is only
      # exercised here.
      - 'crates/codegg-core/src/git_publication.rs'
      - 'src/git_publication/**'
      - 'src/git_mutations.rs'
      - 'src/tool/factory.rs'
      - 'src/tool/git.rs'
      - 'src/tool/commit.rs'
      - 'tests/command_git/git_index_publication.inc'
      # C008 contained worktree creation: the creation seam, the contained
      # child, the grant it runs with, and the mount view that renders it.
      # The contained `git worktree add` is only exercised here, so a change
      # to any of these must be able to trigger this qualification job.
      - 'crates/codegg-core/src/worktree.rs'
      - 'crates/codegg-core/src/worktree_service.rs'
      - 'src/git_contained_worktree.rs'
      - 'tests/contained_worktree_c008.rs'
      - 'tests/agent_loop/workspace_root_execution_authority.inc'
  push:
    paths:
      - '.github/workflows/linux-m004-native.yml'
      - 'src/bin/codegg-sandbox-helper.rs'
      - 'src/managed_process.rs'
      - 'src/interactive_process.rs'
      - 'src/lsp/**'
      - 'src/agent/turn_runtime.rs'
      - 'src/tool/mod.rs'
      # C002: the Tool Program delegated-child route carries the accepted
      # network intent and sandbox ceiling. A change to either the tool
      # boundary that stamps them or the executor that binds them must be
      # able to trigger this qualification job.
      - 'src/tool/tool_program.rs'
      - 'src/tool/tool_program_context.rs'
      # M005 owner surface: the network intent, the durable payloads that
      # carry it, and every launch owner that has to refuse when it cannot
      # honor an offline request. A change to any of these must be able to
      # trigger this qualification job.
      - 'crates/codegg-core/src/approval.rs'
      - 'crates/codegg-core/src/authorization/**'
      - 'crates/codegg-core/src/jobs/**'
      - 'crates/codegg-core/src/session/schema.rs'
      - 'crates/codegg-protocol/src/core.rs'
      - 'src/agent/**'
      - 'src/core/**'
      - 'src/interactive_process_attach.rs'
      - 'src/python_script/**'
      - 'src/scheduler/**'
      - 'src/tool/bash.rs'
      - 'src/tool/bash/**'
      - 'src/tool/test.rs'
      - 'src/tool/python_script.rs'
      - 'crates/egglsp/src/client.rs'
      - 'crates/egglsp/src/launch.rs'
      - 'crates/egglsp/src/runtime.rs'
      - 'crates/egglsp/src/service.rs'
      - 'src/security/sandbox.rs'
      - 'src/security/sandbox/**'
      - 'tests/linux_git_test_support/linux_m004_process_ipc.inc'
      - 'tests/interactive_process_attach_resume/interactive_process_attach_resume.inc'
      # C007 publisher surface: the private-index staging, the durable
      # journal, the compare-and-swap publication, and the startup
      # reconciler. A change to any of these must be able to trigger this
      # qualification job, because the contained staging step is only
      # exercised here.
      - 'crates/codegg-core/src/git_publication.rs'
      - 'src/git_publication/**'
      - 'src/git_mutations.rs'
      - 'src/tool/factory.rs'
      - 'src/tool/git.rs'
      - 'src/tool/commit.rs'
      - 'tests/command_git/git_index_publication.inc'
      # C008 contained worktree creation: the creation seam, the contained
      # child, the grant it runs with, and the mount view that renders it.
      # The contained `git worktree add` is only exercised here, so a change
      # to any of these must be able to trigger this qualification job.
      - 'crates/codegg-core/src/worktree.rs'
      - 'crates/codegg-core/src/worktree_service.rs'
      - 'src/git_contained_worktree.rs'
      - 'tests/contained_worktree_c008.rs'
      - 'tests/agent_loop/workspace_root_execution_authority.inc'

permissions:
  contents: read

concurrency:
  group: linux-m004-native-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  process-ipc:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'planning/linux-sandbox-next-admission-and-adr-cleanup' }}
    runs-on: ubuntu-24.04
    # This job builds the whole workspace from a cold cargo cache and then
    # runs the M004/M005 suite, which launches a contained process per case.
    # On the same head, the push-triggered job completed in 37m42s, while two
    # PR-triggered attempts reached the 45-minute limit during final LSP
    # qualification. Give runner variance enough headroom to finish the whole
    # suite; individual containment probes retain their own 10-minute bounds.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      CODEGG_RUN_M004_BWRAP_NATIVE: '1'
      CODEGG_RUN_C009_BWRAP_NATIVE: '1'
      # The "Protected mount and Git regressions" step runs the
      # `protected_mount_` filter, which also selects the two protected-mount
      # regressions gated on the C006 native qualification — the real managed
      # process handoff and the PTY first hop. Without this gate those two
      # tests skipped here, and one of them skipped *silently*, so the step
      # reported a green run that had qualified only 9 of its 11 selected
      # tests. This job installs Bubblewrap and enables user namespaces, the
      # same setup the C006 job has, so the gate's preconditions hold.
      CODEGG_RUN_C006_BWRAP_NATIVE: '1'
      CODEGG_RUN_M004_CARGO_NATIVE: '1'
      CODEGG_RUN_M004_PTY_NATIVE: '1'
      CODEGG_RUN_M005_OFFLINE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Record native runner capabilities
        run: |
          uname -a
          bwrap --version
          id
          cat /proc/sys/user/max_user_namespaces
          printf 'Seccomp actions: '
          cat /proc/sys/kernel/seccomp/actions_avail || true
          printf 'AppArmor profile: '
          cat /proc/self/attr/current || true
          printf 'Bubblewrap mode: '
          stat -c '%a %u %n' "$(command -v bwrap)"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true

      - name: Enable user namespaces for isolated native qualification
        run: |
          # GitHub-hosted Ubuntu 24.04 enables AppArmor's unprivileged-userns
          # restriction. Relax only this ephemeral VM gate for Bubblewrap tests.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true

      - name: Build trusted sandbox helper
        run: cargo build --locked --bin codegg-sandbox-helper

      - name: C007 private-index publication under containment
        # Run first, and with its own budget, so the C007 qualification is
        # recorded independently of the wider suite: a suite that runs long
        # must not be able to hide this result, and a hang here must fail
        # this step rather than cancel the whole job.
        timeout-minutes: 10
        run: python3 scripts/check_test_filter_execution.py --run -- cargo test --locked --test linux_git_test_support --features linux-git-test-support production_private_index_publisher_stages_and_publishes_under_containment -- --nocapture --test-threads=1

      - name: C008 contained managed-worktree creation under containment
        # The C008 qualification is recorded independently of the wider
        # suite: it creates a real managed worktree through the contained
        # child and proves that a hostile repository configuration cannot
        # reach the host. Its own budget, so a hang here fails this step
        # rather than cancelling the whole job.
        timeout-minutes: 10
        run: cargo test --locked --test contained_worktree_c008 -- --nocapture --test-threads=1

      - name: A001 explicit read-only isolated placement obtains distinct contained checkouts
        # This is the positive production-executor qualification for A001.
        # It runs only on the Linux M004 host because the required protected
        # mount view is supplied by the qualified Bubblewrap backend.
        timeout-minutes: 10
        run: python3 scripts/check_test_filter_execution.py --run -- cargo test --locked --test agent_loop explicit_read_only_isolated_new_uses_two_distinct_contained_checkouts -- --nocapture --test-threads=1

      - name: A002 existing managed read-only placement uses the production scheduler
        # The selected-checkout path must execute through daemon scheduling and
        # release its exact run-owned lease while retaining the checkout.
        timeout-minutes: 10
        run: python3 scripts/check_test_filter_execution.py --run -- cargo test --locked --test agent_loop existing_managed_read_only_runs_through_the_production_scheduler -- --nocapture --test-threads=1

      - name: A003 repository quota production Cargo comparison
        # This test submits real Cargo builds through JobSubmissionService,
        # JobScheduler and ManagedArgvExecutor, and prints the measured
        # disabled/enabled/unrelated-repository cases.
        timeout-minutes: 10
        run: cargo test --locked -p codegg --lib repository_quota_controls_production_cargo_build_admission -- --ignored --nocapture --test-threads=1

      - name: M004 managed-process host PID and IPC denial probes
        run: cargo test --locked --test linux_git_test_support --features linux-git-test-support -- --nocapture

      - name: M004 constrained PTY live-owner qualification
        run: python3 scripts/check_test_filter_execution.py --run -- cargo test --locked -p codegg --lib interactive_process::tests::m004_live_owner_preserves_tty_and_private_process_view -- --test-threads=1 --nocapture

      - name: M004 daemon-authorized PTY routing and descendant cleanup
        env:
          CODEGG_RUN_M004_PTY_NATIVE: '1'
        run: python3 scripts/check_test_filter_execution.py --run -- cargo test --locked --test interactive_process_attach_resume m004_daemon_constrained_pty_uses_principal_profile_and_cancels_descendant -- --nocapture

      - name: M004 daemon-owned constrained LSP duplex and procfs qualification
        run: python3 scripts/check_test_filter_execution.py --run -- cargo test --locked -p codegg --lib lsp::m004::tests::constrained_lsp_process_is_owned_by_m004_scope --features lsp-test-support -- --test-threads=1 --nocapture

      - name: Protected mount and Git regressions
        run: |
          python3 scripts/check_test_filter_execution.py --run -- cargo test --locked --lib protected_mount_ -- --nocapture
          python3 scripts/check_test_filter_execution.py --run -- cargo test -p egggit --locked trusted_git -- --test-threads=1

  restricted-userns-fails-closed:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'planning/linux-sandbox-next-admission-and-adr-cleanup' }}
    runs-on: ubuntu-24.04
    # This job passed its 20-minute budget with 2m24s to spare, so the
    # headroom is thin enough to turn a slow runner into a lost qualification.
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 4
      CODEGG_RUN_M004_RESTRICTED_USERNS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Disable user namespaces in the ephemeral runner
        run: |
          uname -a
          bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
          sudo sysctl -w user.max_user_namespaces=0
          test "$(cat /proc/sys/user/max_user_namespaces)" = 0

      - name: Build trusted sandbox helper
        run: cargo build --locked --bin codegg-sandbox-helper

      - name: Required M004 launch refuses before target under host userns policy
        run: python3 scripts/check_test_filter_execution.py --run -- cargo test --locked --test linux_git_test_support --features linux-git-test-support required_process_tier_fails_closed_when_user_namespaces_are_restricted -- --nocapture

      - name: Constrained PTY route refuses before target under host userns policy
        run: python3 scripts/check_test_filter_execution.py --run -- cargo test --locked --test interactive_process_attach_resume m004_daemon_constrained_pty_fails_closed_when_user_namespaces_restricted -- --nocapture

      - name: Constrained LSP launch refuses before target under host userns policy
        run: python3 scripts/check_test_filter_execution.py --run -- cargo test --locked -p codegg --lib lsp::m004::tests::constrained_lsp_launch_fails_before_target_when_userns_are_restricted --features lsp-test-support -- --test-threads=1 --nocapture

  git-cost-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'planning/linux-sandbox-next-admission-and-adr-cleanup' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
      CODEGG_RUN_LINUX_GIT_COST_PERF: '1'
      CODEGG_RUN_M005_OFFLINE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Qualify Bubblewrap host policy
        run: |
          uname -a
          bwrap --version
          id
          stat -f -c 'filesystem=%T' "$GITHUB_WORKSPACE"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build trusted sandbox helper
        run: cargo build --locked --bin codegg-sandbox-helper

      - name: Measure packed and fragmented cold/warm Git reads
        run: |
          CODEGG_GIT_COST_FILESYSTEM="$(stat -f -c %T "$GITHUB_WORKSPACE")" \
            cargo test --locked --test linux_git_test_support --features linux-git-test-support -- --nocapture

      - name: Upload C002 performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-git-c002-performance-${{ github.sha }}
          path: linux-git-c002-performance.json
          if-no-files-found: warn
          retention-days: 7
