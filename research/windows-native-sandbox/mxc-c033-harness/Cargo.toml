[workspace]

[package]
name = "codegg-mxc-c033-requalification"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mxc-sdk = "=1.0.0"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
