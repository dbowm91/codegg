[package]
name = "codegg-desktop"
version = "0.1.0"
description = "Optional CodeGG desktop shell"
edition = "2021"
rust-version = "1.90"

[workspace]
members = ["."]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
codegg-client = { path = "../../../crates/codegg-client" }
codegg-protocol = { path = "../../../crates/codegg-protocol" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
