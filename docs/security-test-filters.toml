# Security test-filter execution registry
#
# Every CI step that runs a **named subset** of security tests is registered
# here. The registry is consumed by `scripts/check_test_filter_execution.py`,
# which is both a static guard (run by `scripts/verify.sh quick` and by
# `.github/workflows/ci.yml`) and the runtime wrapper the workflow steps
# themselves invoke.
#
# WHY THE REGISTRY EXISTS
#
# A step that runs `cargo test --lib some_filter_` is **green when the filter
# matches zero tests**: cargo prints `0 passed; 0 failed; ...; 42 filtered
# out` and exits 0. The step looks like it qualified something and it
# qualified nothing. The same holds for a filter that selects only
# **self-skipping** tests — a test that returns early is reported by cargo as
# `ok`, so the step is green and the boundary was never exercised.
#
# This repository has already paid for that lesson once.
# `tests/linux_m004_process_ipc.rs` carries the note:
#
#     The hosted job that runs this probe used to filter on this test name
#     before the test existed, so the step matched zero tests and stayed
#     vacuously green.
#
# WHAT THE CONTROL ASSERTS
#
# * the registered command is still the command the workflow runs;
# * the filter still selects at least one test *declared in the source*;
# * the step runs through the counting wrapper, so a bypass is a static
#   failure rather than a silent green step;
# * at run time the executed count is non-zero, every registered test name is
#   reported as executed, and no self-skip marker was emitted.
#
# The self-skip marker check needs `--nocapture`: cargo swallows a passing
# test's output without it, so the marker would be invisible. The static guard
# therefore requires `--nocapture` on any entry whose filter selects a
# self-skipping test.
#
# ENTRY FIELDS
#
#   workflow — the workflow file, relative to the repository root.
#   job      — the job in that workflow.
#   step     — the step in that job.
#   command  — the exact command the step runs. The static guard requires it
#              to still appear in the workflow file.
#   filter   — the substring cargo matches against the full test path.
#   tests    — the test names the filter must have actually executed. Each
#              must appear on a reported-as-executed line in the run's output.
#   security — why this filter is security-relevant. An entry without one is
#              rejected: a filter nobody can say what it protects is a filter
#              nobody is watching.
#
# Add new entries to the bottom. Run the guard after every change:
#
#   python3 scripts/check_test_filter_execution.py
#   python3 scripts/check_test_filter_execution.py --self-test

# ---------------------------------------------------------------------
# Linux M004 native qualification
# ---------------------------------------------------------------------

[[filter]]
workflow = ".github/workflows/linux-m004-native.yml"
job = "process-ipc"
step = "C007 private-index publication under containment"
command = "cargo test --locked --test linux_m004_process_ipc --features linux-git-test-support production_private_index_publisher_stages_and_publishes_under_containment -- --nocapture --test-threads=1"
filter = "production_private_index_publisher_stages_and_publishes_under_containment"
tests = ["production_private_index_publisher_stages_and_publishes_under_containment"]
security = "The private-index publisher must stage and publish under containment; the step self-skips without its opt-in."

[[filter]]
workflow = ".github/workflows/linux-m004-native.yml"
job = "process-ipc"
step = "M004 constrained PTY live-owner qualification"
command = "cargo test --locked -p codegg --lib interactive_process::tests::m004_live_owner_preserves_tty_and_private_process_view -- --test-threads=1 --nocapture"
filter = "interactive_process::tests::m004_live_owner_preserves_tty_and_private_process_view"
gates = ["CODEGG_RUN_M004_PTY_NATIVE"]
tests = ["m004_live_owner_preserves_tty_and_private_process_view"]
security = "The constrained PTY route must keep the owner's TTY and hide the private process view; the step self-skips without its opt-in."

[[filter]]
workflow = ".github/workflows/linux-m004-native.yml"
job = "process-ipc"
step = "M004 daemon-authorized PTY routing and descendant cleanup"
command = "cargo test --locked --test interactive_process_attach_resume m004_daemon_constrained_pty_uses_principal_profile_and_cancels_descendant -- --nocapture"
filter = "m004_daemon_constrained_pty_uses_principal_profile_and_cancels_descendant"
gates = ["CODEGG_RUN_M004_PTY_NATIVE"]
tests = ["m004_daemon_constrained_pty_uses_principal_profile_and_cancels_descendant"]
security = "The daemon-authorized PTY route must apply the principal's profile and cancel the descendant; the step self-skips without its opt-in."

[[filter]]
workflow = ".github/workflows/linux-m004-native.yml"
job = "process-ipc"
step = "M004 daemon-owned constrained LSP duplex and procfs qualification"
command = "cargo test --locked -p codegg --lib lsp::m004::tests::constrained_lsp_process_is_owned_by_m004_scope --features lsp-test-support -- --test-threads=1 --nocapture"
filter = "lsp::m004::tests::constrained_lsp_process_is_owned_by_m004_scope"
gates = ["CODEGG_RUN_M004_BWRAP_NATIVE"]
tests = ["constrained_lsp_process_is_owned_by_m004_scope"]
security = "The constrained language server must be owned by the M004 scope, not by the ambient process."

[[filter]]
workflow = ".github/workflows/linux-m004-native.yml"
job = "process-ipc"
step = "Protected mount and Git regressions"
command = "cargo test --locked --lib protected_mount_ -- --nocapture"
filter = "protected_mount_"
gates = ["CODEGG_RUN_C006_BWRAP_NATIVE", "CODEGG_RUN_C009_BWRAP_NATIVE"]
tests = [
  "protected_mount_concurrent_launches_keep_workspaces_separate",
  "protected_mount_pty_first_hop_preserves_terminal_and_workspace_write",
  "protected_mount_records_bounded_cold_and_warm_launch_latency",
  "protected_mount_rejects_denied_descendant_of_writable_root",
  "protected_mount_rejects_deny_alias_into_writable_grant",
  "protected_mount_rejects_git_metadata_replacement_after_lease",
  "protected_mount_rejects_workspace_ancestor_replacement_before_target_start",
  "protected_mount_rejects_workspace_replacement_before_target_start",
  "protected_mount_view_linked_worktree_common_dir_is_read_only",
  "protected_mount_view_real_managed_process_handoff",
  "protected_mount_refuses_bare_repository_as_workspace",
]
security = "The protected-mount view must refuse a replaced workspace, a denied descendant and a writable-grant alias; the filter selects tests that self-skip when the host cannot run them."

