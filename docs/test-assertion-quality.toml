# is static (`#[ignore]`); a runtime `return` is not a skip. Converting
# the opt-in-gated bodies to `#[ignore]` would require `--include-ignored`
# in every qualification workflow and would change which tests run, so
# they are enumerated here instead, each with the workflow that satisfies
# it named.
# ---------------------------------------------------------------------

