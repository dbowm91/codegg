# Test assertion quality manifest
#
# This manifest is the machine-readable record of the triage that milestone
# M006 performed over the repository's test suite, and the input to
# `scripts/check_test_assertion_quality.py`.
#
# The guard's job is to keep the property true as the suite changes. It
# does that by *failing* on anything it does not recognise, which is why
# this file is an explicit enumeration rather than a heuristic.
#
# A test body that reaches a skip marker and returns before any assertion
# reports *passed* having done nothing: the runner cannot see a runtime
# skip. A test body with no panic-capable construct at all asserts
# nothing, and can never fail. Both shapes are invisible to a reader and
# overstate what the suite proves.
#
# ---------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------
#
# schema-version = 1
#     The manifest's schema version. A consumer MUST refuse a version it
#     does not understand rather than guess.
#
# repository-writer-opt-in
#     The environment variable that opts a repository-writing generator
#     into rewriting a checked-in asset. An `#[ignore]`d test that writes
#     inside the repository tree MUST check this variable before the
#     write; a routine `cargo test -- --ignored` cannot satisfy it.
#
# [[no-assertion-exceptions]]
#     One entry per test body the guard reports as having no
#     panic-capable construct. Every entry MUST name either a `helper`
#     or a `construct`. An entry that names neither is a failure, not an
#     exemption: "this test is fine" is not a reason.
#
#   file / line / name
#     The site. `line` is the line of the `fn` keyword.
#
#   category
#     named-helper          — the body delegates to a named helper that
#                             carries the assertion. The helper is named
#                             in `helper`.
#     compile-time-construct — the property under test is checked by the
#                             compiler, not at run time: a trait bound, a
#                             type's existence, a variant's existence. The
#                             construct is named in `construct`.
#     no-panic-property    — the property under test is that a named
#                             production call does not panic on a given
#                             input. The call is named in `helper`.
#
# [[skip-exceptions]]
#     One entry per test body that reaches a skip marker and returns
#     before any assertion. Every entry MUST name a `satisfied-by`.
#
#   class
#     opt-in-gated      — an environment variable a qualification
#                         workflow sets. `condition` names the variable.
#     environment-absent — a tool, a kernel feature, or a helper process
#                         that this machine may not have. `condition`
#                         names what is absent.
#
#   satisfied-by
#     The workflow, script, or feature that satisfies the condition, or
#     the explicit statement that nothing in this repository satisfies
#     it automatically. "Manual probe" is an acceptable value; silence
#     is not.
#
# ---------------------------------------------------------------------
# Measured baseline
# ---------------------------------------------------------------------
#
# Measured on the implementation baseline with `scripts/rust_test_scan.py`
# (the shared Rust-aware scanner):
#
#   test functions                    16,004
#   no-assertion bodies                  141
#   resolved by a local helper          118  (resolved transitively
#                                               through the file's own
#                                               call graph)
#   listed below                         23
#   skip-before-assertion bodies          33
#   listed below                         33
#
# The 118 resolved bodies need no entry: the guard finds the helper in
# the same file, follows the call graph, and names the helper it found.
# A body that stops delegating to an asserting helper becomes a hit and
# must be triaged again.
#
# Post-M007 recount (the tree this manifest is enforced on):
#
#   test functions                    15,919  (16,004 - 84 duplicate
#                                               removals + 1 relocated
#                                               self-test - 1 removed
#                                               stale exception site)
#
#   no-assertion exceptions listed        23  (22 + the relocated
#                                               `secret_scan` self-test,
#                                               whose helper no longer
#                                               lives in its own file)
#   skip-before-assertion bodies          33
#
# The removals are M007's; the two count changes M007 made to this
# manifest's own entries are recorded in the M007 closure record.

schema-version = 1

repository-writer-opt-in = "CODEGG_REGENERATE_ASSETS"

# ---------------------------------------------------------------------
# no-assertion exceptions
