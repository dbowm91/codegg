# ---------------------------------------------------------------------
# Dependency edges — the direction the path rules do not capture
# ---------------------------------------------------------------------
#
# A path rule answers "which tests cover this file?". It cannot answer
# "which tests are affected by this file?" for a file that lives in a
# crate another crate depends on.
#
# The mechanism is simple and unavoidable: the root package depends on
# **all eleven** other workspace crates, and it re-exports several of
# them (`codegg::security::*` is `eggsentry`, `codegg::lsp::*` is
# `egglsp`, `codegg::scheduler::config::*` is `codegg-config`, and so
# on). A change to `crates/eggsentry/src/command.rs` therefore changes
# the behaviour of `codegg::security::scanner::inspect_text`, which the
# root package's own security tool calls, which the root package's
# integration tests call.
#
# The coupling runs **through the dependent's own source**, so a
# path-to-target rule cannot see it: the test file that calls the root's
# security tool does not name `eggsentry` anywhere. That is exactly the
# case the plan's invariant I4 (a scoped run is a superset of the
# change's coverage) exists to catch, and it is why the edge set below
# is part of the manifest rather than left to the selector's judgement.
#
# `[[dependencies]]` declares the workspace's **dependency edges**: an
# entry means "`dependent` depends on `member`". The scope rule is:
#
#   When `member` is affected, every member that transitively depends on
#   it is affected too, and a member pulled in that way contributes its
#   FULL test surface — its library test target and every integration
#   target it owns — rather than only the targets a path rule would
#   match.
#
# The full surface, and not a narrower set, is the honest answer: the
# dependent's tests are black-box over the dependent's public API, and
# that API re-exports the dependency, so **any** of the dependent's
# tests can reach the changed code. A tighter answer would need a
# call graph from every test to every crate, which the repository does
# not have and which this workstream exists to avoid paying for.
#
# The cost is stated plainly: a change to any non-root crate widens the
# scope to the root package's whole integration surface, because the root
# package depends on every other crate. A change confined to the root
# package's own `src/` — the common case — stays precise, because the
# root package has no dependents.
#
# The edge set is **mechanically verifiable**: the guard compares it
# against `cargo metadata`'s workspace-local dependency edges and fails
# when an edge is missing or invented. A dependency added to the
# workspace without a manifest entry is a guard failure, not a silent
# under-selection.
#
# `member`    — the crate whose change can affect the dependent.
# `dependent` — the crate that depends on it.

[[dependencies]]
member = "codegg-client"
dependent = "codegg"

[[dependencies]]
member = "codegg-config"
dependent = "codegg"

[[dependencies]]
member = "codegg-config"
dependent = "codegg-core"

