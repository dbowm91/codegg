# Test ownership manifest
#
# This manifest maps source paths to the workspace members that own them and
# to the test targets that cover them. It is the machine-readable input to the
# change-scoped verification mode described in
# `plans/implementation/ci-test-throughput-recovery/003-change-scoped-verification-mode.md`.
#
# Consumers:
#
#   scripts/check_test_ownership.py  — the static guard that keeps this file
#                                       honest (a manifest entry that names a
#                                       nonexistent target, a target no entry
#                                       owns, an unknown member, or a path
#                                       pattern that matches no file is a
#                                       failure).
#   the scoped verification mode     — reads this file to compute the affected
#                                       members and the affected test targets
#                                       for a change, and selects only those
#                                       via repeated `--test` flags.
#
# THE HOSTED CI JOB'S SCOPE IS NOT AFFECTED BY THIS FILE. `scripts/verify.sh
# quick` and `scripts/verify.sh full`, and the hosted `CI / verify` job, keep
# running the whole workspace suite. This file describes coverage; it never
# removes coverage from CI. Scoping is a developer-local affordance only.
#
# ---------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------
#
# schema-version = 1
#     The manifest's schema version. A consumer MUST refuse a version it does
#     not understand rather than guess.
#
# [[members]]
#     One entry per workspace member. Exactly one entry per member; the
#     guard fails on a missing or a duplicated member.
#
#   name = "<cargo package name>"
#       The member's cargo package name, exactly as `cargo metadata` reports
#       it. This is the key the scoped mode uses to select `-p <package>`.
#
#   root = "<member source directory, relative to the repo root>"
#       The directory that holds the member's production sources. Every path
#       under this directory belongs to the member. A member with no source
#       directory of its own is not representable and does not exist.
#
#   lib-test-target = "<member's library test target name>"
#       The name cargo gives the member's library unit-test harness (cargo
#       names it after the crate, with underscores). An affected member
#       ALWAYS contributes this target. A member with no integration test
#       targets therefore needs no `[[groups]]` entry at all: its lib test
#       target is owned by the member entry itself.
#
# [[groups]]
#     One coverage group per subject. A group names the member it belongs to,
#     the source paths its subject covers, and the test targets that cover
#     those paths.
#
#   id = "<stable group id>"
#       A stable, human-readable identifier for the group (kebab or snake
#       case). It is a manifest-local key: it appears in the scoped mode's
#       output and in guard diagnostics, and it must not be renamed casually.
#
#   member = "<cargo package name>"
#       The member this group belongs to. Must name a member declared above.
#       A group's `targets` are resolved within this member.
#
#   paths = ["<source-path glob>", ...]
#       Source-path globs, relative to the repo root, that the group's
#       subject covers. A changed file matching any of them selects the
#       group's targets.
#
#   targets = ["<test target name or glob>", ...]
#       The test targets that cover the group's subject. A bare name (a
#       pattern with no metacharacters) is an exact target name; a pattern
#       with metacharacters is matched against every test target name in the
#       group's member.
#
#       A group's `targets` may also name its member's `lib-test-target` — the
#       `root_catch_all` group does — so a member's target universe is its
#       integration test targets PLUS its library test target. A library test
#       target that no group names is still owned: its `[[members]]` entry
#       owns it.
#
# ---------------------------------------------------------------------
# Matching semantics
# ---------------------------------------------------------------------
#
# Path and target patterns are fnmatch-style globs:
#
#   *        matches any run of characters EXCEPT `/`
#   **       matches across directory separators
#   ?        matches exactly one character
#
# A path glob is matched against the changed file's repo-root-relative path.
# A target pattern is matched against each test target name in the group's own
# member.
#
# ---------------------------------------------------------------------
# How a path resolves to a member
# ---------------------------------------------------------------------
#
# The LONGEST matching member root wins: a path under `crates/codegg-core/src`
# resolves to `codegg-core`, not to the root package. A path under no member
# root at all — a top-level script, a document, an asset, a file in the
# repository's `tests/` directory — is "outside every member". The scoped
# mode's documented action for a path outside every member is to WIDEN TO THE
# WHOLE WORKSPACE. Widening is never a silent skip: the mode prints the
# changed files it considered, the members it selected, and the reason.
#
# ---------------------------------------------------------------------
# The catch-all rule
# ---------------------------------------------------------------------
#
# A changed file that matches no group's `paths` widens the scope to its whole
# member rather than being skipped. The `root_catch_all` group is the
# documented catch-all for the root package: its `paths` name the root
# package's remaining top-level source paths (`src/lib.rs`, `src/main.rs`,
# `src/bin/**`), and its `targets` name the root package's library test
# target. It exists so that the root package always contributes its lib test
# target to a scoped run, and so that a change to a root source file that no
# precise group claims is visibly attributed rather than silently dropped.
#
# ---------------------------------------------------------------------
# How M004's family consolidation shrinks this file
# ---------------------------------------------------------------------
#
# The schema did not change when M004 consolidated the root package's
# integration targets into families. `targets` are GLOBS OVER TARGET NAMES,
# not fixed target lists, so a group that listed forty-one `tui_*` targets
# lists ONE family target after consolidation. The membership changed; the
# schema, the field names, and the guard's rules did not.
#
# M004 has now been applied. Every root group names its family target (or,
# for `core_daemon`, its family plus the two pre-existing directory
# targets), and the manifest shrank accordingly: the root package went from
# 288 test targets to 21, and the `targets` lists here went from 288 names
# to 22. The guard's rule that a real test target must be owned by some
# group is what proves the consolidation did not orphan one.
#
# The family target names are stable: a family is named after the subject it
# covers, and the six binaries that `.config/nextest.toml` reserves the
# runner for keep their original names so their `binary(...)` filters still
# resolve.
#
# ---------------------------------------------------------------------
# Notes on specific group placements
# ---------------------------------------------------------------------
#
#   `project_activation` (tests/core_daemon/project_activation.inc) is owned by
#   `core_daemon`, not by `tui_render`. It exercises project-catalog
#   activation, lease coalescing, and restart hydration through
#   `codegg::core::daemon::CoreDaemon` and
#   `codegg::core::project_activation::HealthState`; it references no TUI
#   module at all.
#
#   `projection_replay` (tests/projection_replay/) and `session_family`
#   (tests/session_family/) are the two already-consolidated directory
#   targets. Both are owned by `core_daemon`: the first is a daemon
#   projection subject and the second is the daemon-owned session family.
#
#   The legacy shared test helper (`tests/test_util.rs`) was **removed** by
#   M004: it held zero test functions and had zero references, and cargo was
#   auto-discovering it as its own executable. Its former group is gone with
#   it, so no group's `paths` point outside a member's source root any more.
#
# ---------------------------------------------------------------------
# Group inventory
# ---------------------------------------------------------------------
#
# The root package's test targets are grouped into 21 subject groups: twenty
# precise subject groups and one documented catch-all. Before M004's
# consolidation the root package had 288 test targets and a twenty-second
# group for the legacy shared helper; that helper was dead and was removed,
# and the 288 targets are now 21 family targets.
#
# The other four members that own integration test targets (`codegg-client`,
# `codegg-core`, `codegg-document`, `egglsp`) have their own groups below. The
# seven remaining members own no integration test targets; their lib test
# target is owned by their `[[members]]` entry.
#
# Run the guard after every change:
#
#   python3 scripts/check_test_ownership.py
#   python3 scripts/check_test_ownership.py --self-test

schema-version = 1

