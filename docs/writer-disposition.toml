# M005 writer-containment corrective C001 — CodeGG writer-root dispositions.
#
# WHAT THIS FILE IS
#   A contract manifest. It records, for every CodeGG writer root identified
#   by the C001 source audit, the restricted-profile disposition that the
#   ADR-0044 contract assigns to it.
#
# WHAT THIS FILE IS NOT
#   It is not a permission, a permit, a fence, or an enablement. No entry
#   here authorizes any writer. `fenced-native` names a CANDIDATE for the
#   successor milestones C002/C003 to consider -- it does not fence anything
#   today.
#
#   ADR-0044 option B was ACCEPTED on 2026-10-19. That acceptance unblocked
#   C002 only; it enabled no writer, and C003-C006 remain blocked on their
#   own predecessor closures. This manifest exists so that a new writer route
#   cannot appear without someone deciding its disposition explicitly.
#
#   C002 shipped the checkout writer permit itself
#   (crates/codegg-core/src/writer_permit.rs, src/core/writer_permit.rs) and
#   C003 routed the native file writers and the typed Git mutations through
#   the checkout writer fence (src/tool/writer_fence.rs,
#   src/core/writer_fence.rs). C003's containment rule is a fact about the
#   running system: a native writer whose target resolves outside the run's
#   own checkout is refused before the effect.
#
#   C004 (2026-10-20) closed the non-broker side. Every CodeGG entry point
#   that can write into an *active shared-reserved checkout* is now either
#   mediated by the checkout reservation gate
#   (crates/codegg-core/src/checkout_reservation.rs,
#   src/core/checkout_mediation.rs) or classified here with an explicit
#   project-local-state disposition. The gate refuses a non-broker writer
#   BEFORE its first effect, so a refused writer leaves no file, index,
#   branch or metadata change behind, and the refusal is recorded durably
#   as a `checkout_writer_refusal` audit event.
#
#   C005 (process denial) and C006 (the production path) remain, and no
#   shared mutation exists yet: nothing in production places two runs on
#   one checkout.
#
# C004 STABLE STORE POLICY (project-local state)
#   CodeGG's project-local state lives under `<checkout>/.codegg/`. It is
#   physically INSIDE the checkout and is never claimed to be outside it. It
#   is, however, CodeGG-managed sidecar state: no path under it is tracked
#   by Git, and writing it changes no repository file, no Git index entry,
#   no branch and no ref. The checkout mediation therefore governs checkout
#   CONTENT -- the files Git tracks, plus the Git index, branches and refs
#   -- and every `.codegg/` writer root is classified individually below:
#
#     namespaced-state  the path carries a per-actor identifier (a run id, a
#                       goal id, a content digest, a tool-call id), so two
#                       actors cannot write the same file.
#     shared-sidecar    the path is a fixed name every actor writes. The
#                       accepted consequence is recorded in the root's
#                       note: two concurrent CodeGG writers may lose one
#                       line in CodeGG's OWN sidecar index. Nothing in the
#                       repository is affected.
#     compatibility-store
#                       the legacy project-local SQLite file. The live
#                       store is user-scoped; this is a backward-compatible
#                       artifact addressed by the process CWD.
#
#   The guard checks the classification, not the prose: a `mediated-gate`
#   root must name the file that holds its mediation call and the markers
#   that identify it, and the guard fails when that call disappears.
#
# GUARD
#   scripts/check_writer_disposition.py fails when a model-facing writer tool
#   or a daemon/HTTP/project-state module that performs a filesystem effect
#   has no entry here, when an entry's vocabulary is invalid, when a declared
#   path no longer exists, or when a checkout writer is classified as a
#   harmless read.
#
# SCOPE
#   CodeGG-managed writers only. Independent external same-UID programs (an
#   editor the user runs, another agent, a build script outside CodeGG) are
#   explicitly out of contract: CodeGG cannot fence them. The `external`
#   entry records that boundary instead of pretending to hold it.
#
# VOCABULARY
#   surface      model-tool | direct-tool | daemon | http | project-state |
#                process | external
#   scope        checkout-writer  -- can mutate a checkout
#                non-checkout     -- writes managed state proven outside every
#                                   checkout
#                read-only        -- proven read-only
#                external         -- an independent same-UID program
#   disposition  allowed-read     -- proven read-only, nothing to restrict
#                fenced-native    -- fenced native file/Git writer (C003)
#                denied-process   -- process-backed or persistent; denied
#                                   before launch or effect
#                fenced-or-denied -- CodeGG non-broker writer; fence it or
#                                   refuse it
#                mediated-gate    -- CodeGG non-broker writer mediated by the
#                                   C004 checkout reservation gate
#                namespaced-state -- inside the checkout, per-actor
#                                   namespaced project-local state
#                shared-sidecar   -- inside the checkout, fixed shared path
#                                   of CodeGG-managed sidecar state
#                compatibility-store
#                                -- the legacy project-local SQLite file
#                new-root-only    -- creates only a path that does not exist
#                                   yet, so it cannot write into a checkout
#                unsupported      -- platform / node / NonGit unsupported
#                out-of-contract  -- outside the restricted profile's
#                                   guarantee
#
#   mediation   writer-fence     -- the C003 native writer fence
#                checkout-gate    -- the C004 checkout reservation gate
#                none             -- no checkout mediation claimed; the
#                                   disposition says why
#
# CHECKOUT LOCATOR LEGEND
#   workspace-root    resolved from the job/turn workspace identity
#   worktree-path     resolved from a leased worktree record
#   model-path        a model/client supplied path, joined onto the root
#   managed-root      a CodeGG-owned root outside every checkout
#   process-cwd       inherited from the spawned child's working directory
#   none              the sink performs no filesystem effect

