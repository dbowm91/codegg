# ---------------------------------------------------------------------------
# Non-broker daemon, HTTP and project-state writer modules.
#
# These are the easiest to miss: they mutate a checkout WITHOUT passing
# through the model ToolBroker, and an authenticated human CodeGG write may
# not bypass them either.
# ---------------------------------------------------------------------------

[[root]]
id = "module.lsp_mutation"
path = "src/lsp/mutation.rs"
surface = "daemon"
scope = "checkout-writer"
disposition = "fenced-native"
owner = "LspMutationApplier"
locator = "workspace-root"
lifetime = "request-scoped"
kind = "module"
note = "Daemon-owned application of reviewed LSP workspace edits. The checked native primitives already exist in-tree (checked_workspace_text_write / _file_delete / _file_create), so this is the strongest fenced-native candidate; every digest check is check-then-act."

