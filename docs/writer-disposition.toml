# ---------------------------------------------------------------------------
# CodeGG-managed process launchers. These are the *final effect owners* of
# the process sinks C001 recorded in
# `plans/implementation/agent-workstream-m005-writer-containment-corrective/c001-evidence/02-process-persistent-sinks.md`.
#
# The manifest already named the *tools* that reach most of these sinks, but
# not the launchers that perform them, so the owner of every process writer
# was outside the manifest. A launcher is a writer root on its own account:
# what its child writes is not statically knowable, so the root is declared
# and denied rather than inferred from the command text.
#
# C005 owns the deny contract for these. Until then the disposition is a
# statement of the required outcome, not a behaviour.
# ---------------------------------------------------------------------------

[[root]]
id = "module.managed_process"
path = "src/managed_process.rs"
surface = "process"
scope = "checkout-writer"
disposition = "denied-process"
mediation = "none"
owner = "ManagedProcessService"
locator = "canonical_workdir from the tool's allowed paths, else the workspace root"
lifetime = "request-scoped for the child, but a descendant that calls setsid escapes the process-group cleanup"
kind = "process"
note = "The single owner of every finite process writer: bash, terminal, formatter, the plugin runtime, the hook shell adapter and the human shell all launch through it."

