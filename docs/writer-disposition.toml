owner = "ProjectInitAuthority"
locator = "workspace-root, publishing the root AGENTS.md"
lifetime = "request-scoped, at project initialization"
kind = "module"
note = "Publishes a root document into the checkout through publish_checked. It runs before a model turn, so it does not know a run id; the C004 gate therefore resolves the reservation from the workspace alone and refuses the publication before any write."

