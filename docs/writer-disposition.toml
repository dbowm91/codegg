scope = "external"
disposition = "out-of-contract"
owner = "none: CodeGG does not own these writers"
locator = "outside CodeGG's control"
lifetime = "not controlled by CodeGG"
kind = "module"
note = "Editors, shells and agents the user runs outside CodeGG under the same OS user. ADR-0042 option B explicitly does not exclude them; excluding them needs a separate OS isolation ADR."
