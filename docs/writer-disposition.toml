tool = "write"
path = "src/tool/write.rs"
surface = "model-tool"
scope = "checkout-writer"
disposition = "fenced-native"
owner = "WriteTool"
locator = "model-path joined onto workspace-root"
lifetime = "request-scoped"
kind = "native-file"
note = "Native file write. Candidate for the C003 fenced transaction; not fenced today."

