# ---------------------------------------------------------------------------
# Non-broker daemon, HTTP and project-state writer modules.
#
# These are the easiest to miss: they mutate a checkout WITHOUT passing
# through the model ToolBroker, and an authenticated human CodeGG write may
# not bypass them either.
# ---------------------------------------------------------------------------

[[root]]
id = "module.lsp_mutation"
path = "src/lsp/mutation.rs"
surface = "daemon"
scope = "checkout-writer"
disposition = "mediated-gate"
mediation = "checkout-gate"
mediation_site = "src/core/daemon.rs"
mediation_markers = "CheckoutWriterSink::LspPreviewApply"
owner = "LspMutationApplier"
locator = "workspace-root"
lifetime = "request-scoped"
kind = "module"
note = "Daemon-owned application of reviewed LSP workspace edits. The broker path is fenced by C003; the human change-review path (CoreRequest::LspPreviewApply) is mediated by the C004 checkout reservation gate, which refuses before the first write."

[[root]]
id = "module.server_file_route"
path = "src/server/routes/file.rs"
surface = "http"
scope = "checkout-writer"
disposition = "mediated-gate"
mediation = "checkout-gate"
mediation_site = "src/server/routes/file.rs"
mediation_markers = "CheckoutWriterSink::HttpFileWrite,CheckoutWriterSink::HttpFileDelete"
owner = "FileRoute"
locator = "workspace-root, from the HTTP request path"
lifetime = "request-scoped"
kind = "module"
note = "HTTP file write and delete API. An authenticated human write must not bypass the shared reservation: the route asks the C004 gate before the first filesystem mutation and answers 409 Conflict when the checkout is reserved."

[[root]]
id = "module.document_service"
path = "src/document_service.rs"
surface = "daemon"
scope = "checkout-writer"
disposition = "mediated-gate"
mediation = "checkout-gate"
mediation_site = "src/core/daemon.rs"
mediation_markers = "CheckoutWriterSink::DocumentSave,CheckoutWriterSink::DocumentCreate,CheckoutWriterSink::DocumentDelete"
owner = "DocumentService"
locator = "workspace-root"
lifetime = "request-scoped, with a durable document record"
kind = "module"
note = "Editor document create/save/delete. This module is a COORDINATOR, not the effect owner: it performs no filesystem write of its own, and the write goes through crate::lsp::mutation::checked_workspace_text_write / _file_delete / _file_create. The C004 checkout reservation gate refuses the create/save/delete request before the document service runs, so the revision and the dirty-file state are untouched. C004 also fixed a self-deadlock on the create path: it held the workspace repository lock across create-then-open and then re-acquired that same lock in the external-disk refresh, which waited for the guard the caller still held."

[[root]]
