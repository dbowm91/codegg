disposition = "fenced-native"
owner = "DocumentService"
locator = "workspace-root"
lifetime = "request-scoped, with a durable document record"
kind = "module"
note = "Editor document create/save/delete. This module is a COORDINATOR, not the effect owner: it performs no filesystem write of its own, and the write goes through crate::lsp::mutation::checked_workspace_text_write / _file_delete / _file_create, recorded as module.lsp_mutation. It carries a writer lease, revision, base-disk digest and repository lock, but every digest check is check-then-act."

