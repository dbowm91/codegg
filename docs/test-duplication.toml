# Test duplication decision table
#
# This table is the record of milestone M007: every group of test
# functions with an identical body, the survivor chosen for it, the
# reason the survivor keeps the stronger property, and the members
# removed. It is consumed by `scripts/check_test_duplication.py`.
#
# The line numbers are the ones the members had **before** the
# removal; the guard matches members by `file` and `name`, because a
# removal shifts the lines of everything after it.
#
# ---------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------
#
# schema-version = 1
#     The manifest's schema version. A consumer MUST refuse a version it
#     does not understand rather than guess.
#
# [[groups]]
#     One entry per duplicate group.
#
#   boundary
#     cross-crate         — the members are in different crates; every
#                          member is kept.
#     unit-integration    — one member is a unit test and one is an
#                          integration test, in the same crate.
#     integration         — both members are integration tests.
#     unit                — both members are unit tests.
#
#   survivor
#     The `file:name` of the member that was kept. Empty for a
#     cross-crate group, where every member is kept.
#
#   reason
#     Why the survivor keeps the stronger property.
#
#   members
#     Every member of the group, with the file and line it had before
#     the removal, and whether it survived.
#
#   removed
#     The members the removal took out.

schema-version = 1

