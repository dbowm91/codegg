# Storage table ownership (M006)
#
# The one hand-maintained input to the generated storage catalog. Each entry
# maps a table to the module that owns it. The generator
# (`crates/codegg-core/src/session/schema/storage_catalog.rs`) refuses to render
# a catalog naming a table with no entry here, and
# `scripts/check_storage_catalog.py` refuses an entry naming a table the
# migration chain no longer creates.
#
# Regenerate the catalog after editing:
#
#   CODEGG_UPDATE_STORAGE_CATALOG=1 cargo test -p codegg-core storage_catalog
#
# One line per table. This is a mapping, not a description.

