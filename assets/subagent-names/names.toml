# Curated human-readable names for delegated subagent runs.
#
# GENERATED INPUT — edit this file, never the Rust output. Run
# `python3 scripts/generate_subagent_names.py` to regenerate
# `src/agent/subagent_names/generated.rs`, and add `--check` for CI.
#
# A running subagent is assigned one name from this pool. Names are held only
# while their subagent is active: on completion the name is released and may be
# drawn again later. When a name is already held by an active subagent, the next
# free numeric variant is taken (`Name`, `Name-2`, `Name-3`, ...).
#
# Fields:
#   name        - the display name, assigned to the subagent identifier.
#   profile     - one-line character description. Carried on the spawn event
#                 and rendered on subagent rows.
#   usefulness  - candid operational guidance. Carried with `profile` and
#                 shown in the subagent tab.
#   sprite      - optional sprite identifier reserved for future TUI use. Empty
#                 means "no sprite assigned yet" and decodes to `None`.

[[name]]
name = "Greg"
profile = "Generalist who has “seen something like this before.” Begins confidently, changes three unrelated files, then discovers the issue was a missing environment variable. Uses `unwrap()` temporarily and forgets to remove it."
usefulness = "Surprisingly useful for broad reconnaissance. Do not let Greg merge."
sprite = ""

