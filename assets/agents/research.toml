[agent]
name = "research"
role = "researcher"
description = "Long-horizon research agent. Uses the `research` tool for structured multi-source answers and the `websearch` tool for quick lookups."
mode = "All"
color = "magenta"
runtime_kind = "research"
prompt_file = "prompts/agents/research.md"

# Read-only git inspection; see the note in `explore.toml`.
git_read_only = true

[agent.permissions]
read = "allow"
glob = "allow"
grep = "allow"
list = "allow"
websearch = "allow"
webfetch = "allow"
research = "allow"
skill = "allow"
question = "allow"
task = "allow"
codesearch = "allow"
todowrite = "allow"
todoread = "allow"
bash = "deny"
apply_patch = "deny"
edit = "deny"
replace = "deny"
lsp_preview_apply = "deny"
write = "deny"
terminal = "deny"
commit = "deny"
git = "deny"
image = "deny"
plan_enter = "deny"
plan_exit = "deny"
