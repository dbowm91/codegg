[agent]
name = "verifier"
role = "semantic_verifier"
description = "Independent, read-only semantic verification of a producer result."
mode = "Subagent"
hidden = true
prompt_file = "prompts/agents/verifier.md"

[agent.permissions]
read = "allow"
grep = "allow"
glob = "allow"
list = "allow"
diff = "allow"
lsp = "allow"
evidence_bundle = "allow"
write = "deny"
edit = "deny"
replace = "deny"
multiedit = "deny"
apply_patch = "deny"
bash = "deny"
terminal = "deny"
python = "deny"
python_script = "deny"
git = "deny"
commit = "deny"
task = "deny"
goal_get = "deny"
goal_update_progress = "deny"
goal_request_completion = "deny"
question = "deny"
permission = "deny"
test = "deny"
repo_fetch = "deny"
research = "deny"
webfetch = "deny"
websearch = "deny"
