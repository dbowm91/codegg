[agent]
name = "verifier"
role = "semantic_verifier"
description = "Independent, read-only semantic verification of a producer result."
mode = "Subagent"
hidden = true
prompt_file = "prompts/agents/verifier.md"

[agent.permissions]
read = "allow"
grep = "allow"
glob = "allow"
list = "allow"
diff = "allow"
lsp = "allow"
evidence_bundle = "allow"
write = "deny"
edit = "deny"
replace = "deny"
apply_patch = "deny"
lsp_preview_apply = "deny"
bash = "deny"
terminal = "deny"
# The Python tool is `python_script` (`src/python_script/tool.rs`). There is no
# tool named `python`; an earlier `python = "deny"` entry denied nothing and
# read as though it did.
python_script = "deny"
git = "deny"
commit = "deny"
task = "deny"
goal_get = "deny"
goal_update_progress = "deny"
goal_request_completion = "deny"
question = "deny"
# There is no tool named `permission`; the human-interaction tool is
# `question`, denied above. The earlier `permission = "deny"` entry denied
# nothing and read as though it did.
test = "deny"
repo_fetch = "deny"
research = "deny"
webfetch = "deny"
websearch = "deny"
